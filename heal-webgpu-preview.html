<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131c">
  <title>ヒール E · プレビュー</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#07131c; color:#e5f6ef; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { width:min(1120px,100%); margin:auto; padding:20px 12px 28px; }
    h1 { margin:0 0 12px; font-size:clamp(24px,4vw,34px); }
    .stage { width:980px; max-width:100%; aspect-ratio:980/620; overflow:hidden; border:1px solid #315a57; border-radius:8px; background:#07131c; }
    canvas { display:block; width:100%; height:100%; }
    #status { margin:10px 0 0; color:#b4d8d0; font-size:13px; }
    #status:empty { display:none; }
    body.embed main { width:100%; max-width:none; height:100vh; padding:0; }
    body.embed h1, body.embed #status { display:none; }
    body.embed .stage { width:100%; max-width:none; height:100%; aspect-ratio:auto; border:0; border-radius:0; }
  </style>
</head>
<body>
<main>
  <h1>ヒール E</h1>
  <div class="stage"><canvas id="heal" aria-label="ヒール E の再生画面"></canvas></div>
  <p id="status" role="status"></p>
</main>
<script src="webgpu-frame-core.js?v=heal-preview-v2"></script>
<script src="webgpu-primitives.js?v=heal-preview-v2"></script>
<script src="webgpu-compositing.js?v=heal-preview-v2"></script>
<script src="webgpu-renderer.js?v=heal-preview-v2"></script>
<script src="webgpu-heal-e.js?v=heal-preview-v8"></script>
<script src="webgpu-heal-e-sfx.js?v=heal-preview-v8"></script>
<script src="heal-webgpu-preview.js?v=heal-preview-v8"></script>
</body>
</html>
