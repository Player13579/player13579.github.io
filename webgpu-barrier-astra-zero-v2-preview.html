<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1018"><link rel="icon" href="data:,"><title>Barrier E v2 — WebGPU preview</title>
<style>
:root{color-scheme:dark;background:#0a1018;color:#e8edf2;font:14px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:16px}.stage{width:980px;max-width:100%;aspect-ratio:980/620;border:1px solid #27333b;border-radius:8px;overflow:hidden}canvas{width:100%;height:100%;display:block}h1{font-size:22px;margin:0 0 4px}.note,#status{color:#aebbc4;font-size:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}select,button{color:inherit;background:#17232c;border:1px solid #40525e;border-radius:5px;padding:6px 9px}html.embed,html.embed body{height:100%;overflow:hidden}html.embed main{height:100%;padding:0}html.embed h1,html.embed .note,html.embed .controls,#status{display:none}html.embed .stage{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
