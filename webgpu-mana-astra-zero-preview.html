<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <script>if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
  <link rel="icon" href="icon.png">
  <title>マナ獲得 E · 独立WebGPUプレビュー</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#070d19; color:#e8edff; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { width:min(1000px,100%); margin:auto; padding:20px 14px 28px; }
    h1 { margin:0 0 7px; font-size:clamp(22px,4vw,32px); }
    .note { margin:0 0 14px; color:#aab5d2; font-size:13px; }
    .stage { width:980px; max-width:100%; aspect-ratio:980/620; overflow:hidden; border:1px solid #283652; border-radius:10px; background:#080f1c; }
    canvas { display:block; width:100%; height:100%; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:9px 14px; margin-top:12px; font-size:13px; }
    label { display:flex; gap:6px; align-items:center; color:#cbd4ef; }
    select,button { color:inherit; background:#121c30; border:1px solid #344462; border-radius:5px; padding:6px 9px; }
    button { cursor:pointer; }
    #status { min-height:1.4em; margin:9px 0 0; color:#bdc9e7; font-size:12px; }
    #status[data-error="1"] { color:#ffaaa9; }
    html.embed, html.embed body { width:100%; height:100%; overflow:hidden; }
    html.embed main { width:100%; height:100%; margin:0; padding:0; }
    html.embed h1, html.embed .note, html.embed .controls, html.embed #status { display:none !important; }
    html.embed .stage { width:100vw; max-width:none; height:100vh; aspect-ratio:auto; border:0; border-radius:0; }
  </style>
</head>
<body>
<main>
  <h1>マナ獲得 E</h1>
  <p class="note">設計案の独立再生プレビュー · WebGPU · 未統合・品質受入前</p>
  <div class="stage"><canvas id="mana" aria-label="幅のあるマナ場が胸郭へ流入し、受取形として収束するWebGPU再生"></canvas></div>
  <div class="controls" id="controls">
    <label>表示高 <select id="height"><option value="64">H64</option><option value="100">H100</option></select></label>
    <label>DPR <select id="dpr"><option value="1">1</option><option value="2">2</option></select></label>
    <label>移動 <select id="motion"><option value="0">通常</option><option value="1">reduced</option></select></label>
    <label>倍率 <select id="rate"><option value="1">通常</option><option value="2">ACC2固定</option></select></label>
    <button id="restart" type="button">最初から再生</button>
    <button id="sound" type="button">音を有効にする</button>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="webgpu-frame-core.js?v=mana-zero-preview-1"></script>
<script src="webgpu-primitives.js?v=mana-zero-preview-1"></script>
<script src="webgpu-compositing.js?v=mana-zero-preview-1"></script>
<script src="webgpu-renderer.js?v=mana-zero-preview-1"></script>
<script src="webgpu-mana-astra-zero-preview.js?v=mana-zero-preview-1"></script>
</body>
</html>
