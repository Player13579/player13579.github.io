<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Action item use · GPT Pro r01</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111722;color:#9eacbb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}.scroll{width:min(100vw,720px);overflow-x:auto;overscroll-behavior:contain}.stage{position:relative;width:720px;height:400px;overflow:hidden;isolation:isolate;background:#111b27}.back{position:absolute;left:0;width:720px;height:200px}.dark{top:0;background:#111b27}.light{top:200px;background:#e9e6df}.labels{position:absolute;inset:12px 0 auto;display:grid;grid-template-columns:repeat(3,240px);text-align:center;font:10px ui-monospace,monospace;letter-spacing:.1em;color:#90a1b5;z-index:3}.row{position:absolute;left:12px;font:9px ui-monospace,monospace;letter-spacing:.15em;z-index:3}.dark-row{top:182px;color:#8192a5}.light-row{top:382px;color:#707781}.fixture{position:absolute;z-index:1;width:36px;height:64px;transform:translate(-50%,-100%);opacity:.82}.head,.torso,.arm,.leg{position:absolute;display:block}.head{left:11px;top:0;width:14px;height:16px;border-radius:7px;background:#7c8a99}.torso{left:10px;top:18px;width:16px;height:26px;border-radius:5px 5px 2px 2px;background:#667587}.arm{top:22px;left:4px;width:6px;height:24px;border-radius:3px;background:#788798;transform:rotate(5deg)}.arm.right{left:26px;transform:rotate(-5deg)}.leg{top:43px;left:10px;width:6px;height:21px;border-radius:1px 1px 2px 2px;background:#667587}.leg.right{left:20px}canvas{position:absolute;inset:0;width:720px;height:400px;z-index:2;pointer-events:none}.error{position:fixed;inset:8px auto auto 8px;max-width:calc(100vw - 16px);padding:10px 14px;background:#341d1d;color:#ffe5d4;white-space:pre-wrap;font:12px/1.5 system-ui;border-radius:4px}.error[hidden]{display:none}
</style>
</head>
<body>
<div class="scroll" aria-label="Action item use WebGPU effect, H64 dark and light comparison">
<div class="stage">
<div class="back dark"></div><div class="back light"></div>
<div class="labels"><span>MINERAL WATER</span><span>SEAWATER</span><span>ANTIDOTE</span></div>
<div class="row dark-row">DARK</div><div class="row light-row">LIGHT</div>
<div id="fixtures" aria-hidden="true"></div>
<canvas id="vfx" width="720" height="400" aria-label="Three Pro designed item use effects rendered with WebGPU"></canvas>
</div>
</div>
<div id="error" class="error" role="status" hidden></div>
<script type="module" src="../embed.js"></script>
</body>
</html>
