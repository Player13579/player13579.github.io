<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Facility E 03 r0.1 — ChatGPT Pro</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; font: 12px/1.4 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { padding: 8px; background: #13191e; color: #e8edf0; }
    body.verify { background: transparent; }
    #gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
    figure { min-width: 0; margin: 0; }
    figcaption { min-height: 2.7em; padding: 0 2px 4px; overflow-wrap: anywhere; }
    figcaption strong { display: block; font-size: 12px; }
    figcaption small { color: #9cabb4; font: 9px/1.2 ui-monospace, monospace; }
    .field { position: relative; width: 100%; aspect-ratio: 16 / 11; overflow: hidden; }
    .field.dark { background: #111a20; }
    .field.light { background: #e8e9e5; }
    canvas { display: block; width: 100%; height: 100%; }
    .tone { position: absolute; top: 5px; left: 6px; font-size: 9px; letter-spacing: .08em; pointer-events: none; }
    .dark .tone { color: #82929b; }
    .light .tone { color: #57656b; }
    .h64 { position: absolute; left: 50%; top: 50%; width: 64px; height: 1px; transform: translate(-50%, 42px); opacity: .4; pointer-events: none; }
    .dark .h64 { background: #96a9b1; }
    .light .h64 { background: #65747a; }
    #gallery[hidden] { display: none; }
    @media (max-width: 520px) { #gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main id="gallery" aria-label="Three facility effects on dark and light fields"></main>
  <script type="module" src="./preview.mjs"></script>
</body>
</html>
