<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立Mana r0.3 | WebGPU候補</title><link rel="stylesheet" href="preview/style.css"><link rel="stylesheet" href="preview/embed.css"><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script></head>
<body>
<main>
  <header><p class="eyebrow">DEFENDERS vs ATTACKERS / INDEPENDENT GALLERY</p><h1>Mana <span>r0.3</span></h1><p class="sub">WebGPU専用候補・ゲーム未接続</p></header>
  <section class="viewer" aria-label="H64暗明プレビュー">
    <div class="viewer-head"><strong id="scaleLabel">H64 原寸</strong><span>暗背景 / 明背景</span></div>
    <div class="canvas-scroll"><canvas id="view" width="480" height="208" aria-label="同じ獲得イベントを暗明両背景で再生"></canvas></div>
    <div class="viewer-foot"><span id="status" role="status">WebGPUを初期化しています…</span><span id="soundStatus">音：無効</span></div>
  </section>
  <section class="controls">
    <div class="row"><button id="play" class="primary" disabled>一回再生</button><button id="burst" disabled>近接する3件</button><button id="switch" disabled>途中ACC2切替</button><label><input id="repeat" type="checkbox">全寿命を反復</label></div>
    <div class="row"><button id="audio">音を有効化</button><label><input id="mute" type="checkbox" checked>ミュート</label><label><input id="reduced" type="checkbox">低減モーション</label></div>
    <div class="row"><label>移動ACC2 <select id="rate"><option value="off">OFF</option><option value="waiting">待機</option><option value="reserved">予約</option><option value="active">実効ON</option></select></label><label><input id="moving" type="checkbox" checked>移動中</label><label>表示 <select id="zoom"><option value="1">H64原寸</option><option value="2">2倍検査表示</option><option value="4">4倍検査表示</option></select></label></div>
  </section>
  <details id="technical"><summary>検査・無音スクラブ・抑制条件</summary>
    <p>説明を隠した初期表示を品質観察の基準にしてください。拡大・層分解・数値合格はH64の読解合格ではありません。</p>
    <div class="row"><label>無音位相 <input id="scrub" type="range" min="0" max="1000" value="0"></label><output id="phase">0.000</output></div>
    <div class="row"><label>層 <select id="layer"><option value="31">すべて</option><option value="7">本体のみ・周辺光/OBSなし</option><option value="1">供給体</option><option value="2">搬送面</option><option value="4">受領領域</option><option value="8">背景受光のみ</option><option value="16">OBS拡散のみ</option></select></label><label>受け手 <select id="eligibility"><option value="normal">通常</option><option value="dead">死亡</option><option value="departed">退場</option><option value="vented">ベント</option><option value="invisible">透明</option><option value="offscreen">画面外</option></select></label></div>
    <div class="row"><button id="session">ルーム/セッション切替</button><button id="invalid">除外イベントを検査</button><button id="save">実行記録を保存</button><a href="tests/verify.html">無音GPU検査ページ</a></div>
    <pre id="log"></pre>
  </details>
  <footer>人物や代用人形は描きません。位置・受領量は表示用の構成であり、ゲームのマナは変更しません。初期状態は無音です。</footer>
</main><script type="module" src="preview/main.mjs"></script>
</body></html>
