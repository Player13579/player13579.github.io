<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Headshot Contact E · GPT Pro v5 embed</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101722; }
    #status { height: 28px; padding: 6px 12px; color: #b4c0d0; background: #1a2230; font: 12px/16px system-ui, sans-serif; }
    #status[data-state="ready"] { color: #bff0c6; }
    #status[data-state="error"] { color: #ffd4d8; background: #351f26; }
    iframe { display: block; width: 100%; height: calc(100% - 28px); border: 0; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite" data-state="starting">WebGPU初期化中 · v5 共通E / H64・H32 / 暗・明</div>
  <iframe id="source" title="Headshot Contact E v5 · WebGPU preview"></iframe>
  <script type="module">
    import { previewUrl } from './preview/gallery-adapter.mjs';
    const frame = document.getElementById('source');
    const status = document.getElementById('status');
    frame.src = previewUrl(location.href).href;
    window.__headshotV05Embed = { frame };
    let poll;
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) {
        status.dataset.state = 'error';
        status.textContent = '埋込元を読み取れません。同一配信元を確認してください。';
        return;
      }
      const embedStyle = doc.createElement('link');
      embedStyle.rel = 'stylesheet';
      embedStyle.href = new URL('./preview/embed.css', location.href).href;
      embedStyle.dataset.galleryAdapter = 'v5';
      doc.head.append(embedStyle);
      const params = new URLSearchParams(location.search);
      if (params.has('galleryRelease')) doc.documentElement.dataset.galleryRelease = params.get('galleryRelease');
      poll = setInterval(() => {
        const text = doc.getElementById('status')?.textContent ?? '';
        if (text.startsWith('WebGPU初期化済み')) {
          status.dataset.state = 'ready';
          status.textContent = 'WebGPU ready · v5';
        } else if (text.startsWith('WebGPU未実行') || text.startsWith('実行停止')) {
          status.dataset.state = 'error';
          status.textContent = text;
        }
      }, 250);
    });
    addEventListener('pagehide', () => clearInterval(poll), { once: true });
  </script>
</body>
</html>
