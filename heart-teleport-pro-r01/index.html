<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>内折れ脈室 — ChatGPT Pro r0.1</title>
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CHATGPT PRO · ACTION HEART TELEPORT · R0.1</p>
      <h1>内折れ脈室</h1>
      <p>発動者の位置だけで成立する転移の受領表現。</p>
    </header>
    <section class="stages" aria-label="暗背景と明背景でのH64自動再生">
      <article class="stage-card"><div class="stage-heading"><h2>暗背景</h2><span>H64 · 1×</span></div><div class="stage dark"><canvas id="dark" width="512" height="352" aria-label="暗背景のWebGPU効果"></canvas></div></article>
      <article class="stage-card"><div class="stage-heading"><h2>明背景</h2><span>H64 · 1×</span></div><div class="stage light"><canvas id="light" width="512" height="352" aria-label="明背景のWebGPU効果"></canvas></div></article>
    </section>
    <p id="phase" class="phase" role="status">WebGPUを初期化しています。</p>
    <section class="provenance" aria-labelledby="state-heading">
      <h2 id="state-heading">再生状態・来歴・受入状態</h2>
      <pre id="state">読み込み中</pre>
    </section>
  </main>
  <script type="module" src="./preview.mjs"></script>
</body>
</html>
