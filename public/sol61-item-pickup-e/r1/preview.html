<script type="module">
import {createRenderer,createSfx,DESIGN,VERSION} from './item-pickup-e.mjs';
const params=new URLSearchParams(location.search),verify=params.has('verify');if(params.has('gallery')||params.has('embed'))document.body.classList.add('gallery');
