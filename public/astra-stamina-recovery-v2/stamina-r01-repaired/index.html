<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタミナ回復 — Astra r01 制作候補</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191e;color:#eef2f6;font:14px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:28px}h1{font-size:22px;margin:0 0 10px}p{line-height:1.65;color:#c8cdd3}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view{min-width:0}canvas{display:block;width:100%;height:300px;border:1px solid #434a53;border-radius:8px}label{display:inline-flex;gap:7px;align-items:center;margin:6px 12px 6px 0}button,select{padding:8px;background:#28333e;color:#fff;border:1px solid #657487;border-radius:4px}button:disabled{opacity:.45}.controls{padding:16px 0}.state{font-size:12px;white-space:pre-wrap;color:#abb7c4}body.embed main{width:100vw;height:100vh;max-width:none;padding:0;overflow:hidden}body.embed h1,body.embed p,body.embed .controls,body.embed figcaption{display:none}body.embed .state{display:block}body.embed.embed-ready .state{display:none!important}body.embed .views{width:100%;height:100%;display:block}body.embed .view{width:100%;height:100%;margin:0}figure{margin:0}figcaption{padding:6px 2px;font-size:12px}body.embed .views{gap:0}body.embed canvas{display:block;width:100%;height:100%;border:0;border-radius:0}body.embed .view:last-child{display:none}
</style>
<main><h1>スタミナ回復 — Astra r01</h1><p>制作候補・品質未受入。腰で受け取り、脚へ配分し、支持する余力が定着する一回の応答。1.5 秒の効果と待ち時間を自動ループします。</p>
<div class="views"><figure class="view"><canvas id="dark"></canvas><figcaption>暗色面 / 同じ描画値</figcaption></figure><figure class="view"><canvas id="bright"></canvas><figcaption>明色面 / 同じ描画値</figcaption></figure></div>
<div class="controls"><label>表示 <select id="size"><option value="64">H64 原寸</option><option value="192">H192 拡大</option></select></label><label><input id="spark" type="checkbox" checked>キラキラ</label><label><input id="glow" type="checkbox" checked>近傍光</label><label><input id="main" type="checkbox" checked>主作用</label><label><input id="motion" type="checkbox">動きを抑える</label><button id="sound">音を有効にする</button><button id="pause">一時停止</button><label>時刻 <input id="seek" type="range" min="0" max="1.65" step="0.01" value="0"></label></div>
<div id="status" class="state" role="status">WebGPU 初期化中…</div></main><script type="module" src="./preview.mjs"></script></html>
