<header><h1>Security Room r05 · faithful WebGPU runtime</h1><p><span class="tag">Native fixture only.</span> Synthetic authentication receipts are labeled fixtures and are not game-play or adoption proof. Binding 5 is received-only HDR with alpha 0. This route never uses Canvas 2D and has no SFX.</p></header>

<label>Canvas CSS <select id="size"><option value="1340">1340 × 1174</option><option value="670">670 × 587</option></select></label>
<button id="auth">Send synthetic auth fixture</button>

<label><input id="rack" type="checkbox" checked> rack</label>
<label><input id="visibility" type="checkbox" checked> source visibility</label>
<label><input id="near" type="checkbox" checked> near</label>
<label><input id="flare" type="checkbox" checked> flare</label>

<label>observer <select id="observer"><option value="670,587,-0.1745329252">(670,587), −10°</option><option value="520,700,-0.1745329252">(520,700), −10°</option><option value="670,587,0">(670,587), 0°</option></select></label>
