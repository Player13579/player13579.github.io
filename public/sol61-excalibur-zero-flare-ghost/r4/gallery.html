<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excalibur zero flare/ghost r4</title>
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;background:#0b1018;color:#eef2f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1018}.shell{width:min(980px,100vw);padding:10px}.stage{position:relative;aspect-ratio:2/1;width:100%;overflow:hidden;background:#080b10;display:grid;place-items:center}.stage canvas{width:min(100%,960px);height:auto;aspect-ratio:2/1;display:block}.controls{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px;padding-top:10px}.control{display:flex;gap:6px;align-items:center}.control label{white-space:nowrap}.control input[type=range]{width:100%;min-width:40px}.control select,.control button{font:inherit;color:inherit;background:#182330;border:1px solid #536273;border-radius:4px;padding:4px 7px}.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0}.toolbar button{font:inherit;color:inherit;background:#182330;border:1px solid #536273;border-radius:4px;padding:5px 10px}.status{min-height:1.4em;color:#b8c4d2}.error{white-space:pre-wrap;color:#ff8e8e}.embed .controls,.embed .toolbar,.embed header{display:none}.embed .shell{padding:0;width:100vw}.embed .stage{width:100vw;height:100vh;aspect-ratio:auto}.embed .stage canvas{width:min(100vw,200vh);height:min(100vh,50vw);max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<main class="shell">
<header>Excalibur zero flare / ghost · Sol design · version excalibur-zero-flare-ghost-sol61-r4</header>
<div class="stage"><canvas id="preview" width="960" height="480" aria-label="WebGPU effect preview"></canvas></div>
<div class="toolbar"><button id="play" type="button">Play 1×</button><button id="hold" type="button">Hold current phase</button><button id="audio" type="button">Enable preview SFX</button><span id="status" class="status">Preparing WebGPU…</span></div>
<section class="controls" aria-label="Preview controls">
<div class="control"><label for="phase">Phase</label><input id="phase" type="range" min="0" max="1200" step="1" value="180"><output id="phase-out">180 ms</output></div>
<div class="control"><label for="variant">Variant</label><select id="variant"><option value="normal">Normal</option><option value="GBO">GBO</option></select></div>
<div class="control"><label for="sx">Source X</label><input id="sx" type="range" min="0" max="960" step="0.1" value="172.8"></div>
<div class="control"><label for="sy">Source Y</label><input id="sy" type="range" min="0" max="480" step="0.1" value="297.6"></div>
<div class="control"><label for="cx">Optical center X</label><input id="cx" type="range" min="0" max="960" value="480"></div>
<div class="control"><label for="cy">Optical center Y</label><input id="cy" type="range" min="0" max="480" value="240"></div>
<div class="control"><label for="visibility">Source visibility</label><input id="visibility" type="range" min="0" max="1" step="0.01" value="1"></div>
<label class="control"><input id="reduced-motion" type="checkbox">Reduced motion</label>
<label class="control"><input id="source-on" type="checkbox" checked>Source on</label>
<label class="control"><input id="post-on" type="checkbox" checked>Post response on</label>
<label class="control"><input id="flare-on" type="checkbox" checked>Flare on</label>
<label class="control"><input id="ghost-on" type="checkbox" checked>Ghost on</label>
<label class="control"><input id="near-on" type="checkbox" checked>Near response on</label>
</section>
<pre id="error" class="error" hidden></pre>
</main>
<script type="module" src="./gallery.mjs"></script>
</body></html>
