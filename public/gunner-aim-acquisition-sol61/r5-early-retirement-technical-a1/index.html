(() => {
const q=new URLSearchParams(location.search),token=q.get('galleryStartupToken')||'',versionId=q.get('galleryVersionId')||'',attemptEpoch=Number(q.get('galleryAttemptEpoch')),schema='dva-aim-r5-early-retirement-technical/v1',sourceHash='b57e77caa5c737c658338ed363a7f7e7510f17b124b0c78c843c76c4b317d39a';

const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');const read=async name=>{const r=await fetch(new URL(name,location.href));if(!r.ok)throw Error('HTTP identity '+name);return new Uint8Array(await r.arrayBuffer());};
let identitySettled=false,identityOK=false;const identity=(async()=>{if(!enabled)throw Error('Aim technical query identity');const mb=await read('package-manifest.json'),sb=await read('package-seal.json');if(await hash(mb)!==q.get('galleryPackageManifestSha256')||await hash(sb)!==q.get('galleryPackageSealSha256'))throw Error('Aim technical package pin');const mf=JSON.parse(new TextDecoder().decode(mb)),seal=JSON.parse(new TextDecoder().decode(sb));if(mf.schema!==schema||mf.versionID!==versionId||seal.packageManifestSha256!==q.get('galleryPackageManifestSha256')||mf.sourceManifestSha256!==sourceHash)throw Error('Aim technical manifest identity');for(const f of mf.files){const bytes=await read(f.path);if(bytes.length!==f.bytes||await hash(bytes)!==f.sha256)throw Error('Aim technical closure '+f.path);}identityOK=true;return true;})().finally(()=>{identitySettled=true;});identity.catch(()=>{});

const classify=s=>{if(!terminalValid(s))throw Error('Aim technical terminal incomplete');const t=s.technical;if(s.retirement===null&&s.deviceLosses.length===0&&s.submitted===0&&t.resourcesCreated===0&&t.contextAcquired===false&&s.audio.contextState==='not-created')return 'never-created';if(s.retirement?.owned===true&&s.retirement.destroyCalled===true&&s.retirement.expectedDeviceLost===true&&s.retirement.expectedLossReason==='destroyed'&&t.queueDrained===true&&(!t.contextAcquired||t.contextUnconfigured)&&s.deviceLosses.some(x=>x.ownedDevice===true&&x.expected===true&&x.reason==='destroyed'))return 'destroyed-loss-settled';throw Error('Aim technical device proof incomplete');};
