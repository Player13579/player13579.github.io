<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excalibur — zero swing R6</title>
<style>
html,body{margin:0;background:#101820;color:#ecf0f3;font:15px system-ui,sans-serif}main{max-width:840px;margin:20px auto;padding:0 16px}h1{font-size:22px}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:transparent}button,input,select{font:inherit}button{padding:8px 14px;margin:4px;background:#233541;border:1px solid #728591;border-radius:5px;color:inherit}label{display:inline-flex;gap:7px;align-items:center;margin:6px}#age{width:min(340px,50vw)}#status{white-space:pre-wrap;color:#bdcbd5;font-size:12px}p{line-height:1.5}
.gallery-embed,.gallery-embed body{width:100%;height:100%;overflow:hidden}.gallery-embed body{min-width:0;min-height:0}.gallery-embed #excalibur-root{position:relative;box-sizing:border-box;display:grid;grid-template-rows:minmax(0,1fr);width:100%;height:100%;max-width:none;margin:0;padding:0;overflow:hidden}.gallery-embed #excalibur-root>:not(canvas):not(#embed-error){display:none!important}.gallery-embed #stage{grid-row:1;box-sizing:border-box;display:block;width:100%;height:100%;min-width:0;min-height:0;max-width:none;aspect-ratio:auto;margin:0;padding:0}.gallery-embed #excalibur-root>#embed-error.is-visible{display:block!important;position:absolute;z-index:2;left:8px;right:8px;bottom:8px;box-sizing:border-box;max-height:28%;overflow:auto;padding:8px 10px;border:1px solid #df8b78;border-radius:5px;background:rgba(20,18,18,.96);color:#fff;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<main id="excalibur-root"><h1>Excalibur — zero swing R6</h1><p>光が剣へ収束し、輪郭を満たして実際のスイング方向へ放たれます。既存zero loopのR6・追加改稿1/5です。</p><canvas id="stage" aria-label="Excalibur E"></canvas><div id="embed-error" role="alert" aria-live="assertive" hidden></div>
<p><button id="play">再生</button><button id="hold">固定</button><button id="clear">終了</button><label>時刻 <input id="age" type="range" min="0" max="650" step="0.5" value="180"><output id="ageValue">180</output> ms</label></p>
<p><label><input id="mainOn" type="checkbox" checked>主作用</label><label><input id="sourceOn" type="checkbox" checked>発光源</label><label><input id="obsOn" type="checkbox" checked>レンズ応答</label><label><input id="audioOn" type="checkbox" checked>音</label><label>表示 <select id="size"><option value="64">剣64px</option><option value="192">剣192px</option></select></label><label>向き <select id="aim"><option value="0">右</option><option value="1.5707963267948966">上</option><option value="3.141592653589793">左</option><option value="-1.5707963267948966">下</option></select></label><label><input id="mirror" type="checkbox">左右反転</label><label>供給 <input id="supply" type="range" min="0" max="1" step="0.1" value="1"></label><label>粗さ <input id="roughness" type="range" min="0.14" max="0.8" step="0.01" value="0.24"></label><label>入射光 <input id="keyLight" type="range" min="0" max="4" step="0.1" value="1.4"></label><label>光の方向 <select id="lightSide"><option value="left">左</option><option value="right">右</option></select></label></p>
<p><label><input id="nearOn" type="checkbox" checked>near PSF</label><label><input id="flareOn" type="checkbox" checked>flare</label><label><input id="ghostOn" type="checkbox" checked>ghost</label><label><input id="reflectionOn" type="checkbox" checked>reflection</label></p>
<p>静止した明示グリップの比較用再生です。本編のキャラの手への接続、品質受入、通常音声の聴感は未確認です。</p><pre id="status">準備中…</pre><script type="module" src="./app.mjs"></script></main></html>
