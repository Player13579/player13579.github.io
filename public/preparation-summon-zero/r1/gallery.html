<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Preparation Summon Zero · E replay</title>
  <style>
    :root{color-scheme:dark;font:15px/1.45 system-ui,sans-serif;background:#101820;color:#eaf4fa}
    body{margin:0;padding:16px;display:grid;justify-items:center;gap:10px}
    h1,p{margin:0;text-align:center}
    .screen{width:min(94vw,720px);aspect-ratio:6/5;background:#101820;overflow:hidden}
    canvas{display:block;width:100%;height:100%}
    .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:62rem}
    button,label{padding:6px 9px;border:1px solid #476070;border-radius:5px;background:#182630;color:inherit}
    label{display:flex;align-items:center;gap:5px}
    output{font:12px ui-monospace,monospace;color:#b8d2df}
    html.embed body{padding:0;display:grid;place-items:center;min-height:100vh}
    html.embed h1,html.embed p,html.embed .controls,html.embed #status,html.embed #audioStatus{display:none}
    html.embed .screen{width:min(100vw,120vh);height:auto;aspect-ratio:6/5}
    html.embed canvas{width:100%;height:100%;object-fit:contain}
    html.verify button[data-audio],html.verify output[data-audio]{display:none}
    :focus-visible{outline:3px solid #8bd5ff;outline-offset:2px}
  </style>
</head>
<body>
  <h1>Preparation Summon Zero</h1>
  <p>A synthetic human join shows the zero-design arrival field. No Bot receives an effect or SFX.</p>
  <div class="screen"><canvas id="preview" aria-label="Preparation Summon Zero WebGPU effect with existing human actor art"></canvas></div>
  <div class="controls">
    <button id="play">Replay new join · 1×</button>
    <button id="hold">Hold current phase</button>
    <label>Phase <input id="phase" type="range" min="0" max="980" step="1" value="0"></label>
    <output id="phaseValue">Live · 0 ms</output>
    <label><input id="source" type="checkbox" checked> Source</label>
    <label><input id="near" type="checkbox" checked> Near</label>
    <label>Motion <select id="motion"><option value="normal">Normal</option><option value="reduced">Reduced</option></select></label>
    <label>Intensity <input id="intensity" type="range" min="0.25" max="1.5" step="0.01" value="1"></label>
    <label>Fixture source <select id="sourcePosition"><option value="a">A · center-left</option><option value="b">B · moved right</option></select></label>
    <label>Backdrop <select id="background"><option value="dark">Dark H64</option><option value="light">Light H64</option></select></label>
    <button id="audio" data-audio>Enable sound</button>
    <output id="audioStatus" data-audio>Audio awaits a user gesture.</output>
  </div>
  <output id="status" role="status">Preparing WebGPU…</output>
  <script src="./startup-bootstrap.js"></script>
  <script type="module" src="./gallery.mjs"></script>
</body>
</html>
