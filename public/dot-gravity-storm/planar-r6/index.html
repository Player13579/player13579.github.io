<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>グラビティストーム R6 · 引力図</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;background:#101216;color:#e4e8ec}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:980px;margin:0 auto}h1{margin:0 0 8px;font-size:18px;font-weight:650}p{margin:0 0 14px;color:#aab2bc}.stage{width:min(100%,980px);aspect-ratio:980/620;background:#080b10;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#080b10}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}button{border:1px solid #4b5968;border-radius:5px;background:#202833;color:#eef3f8;padding:7px 12px}label{display:inline-flex;align-items:center;gap:5px}#error{color:#ffaaa5;white-space:pre-wrap}</style></head>
<body><main><h1>グラビティストーム R6 · 引力図</h1><p>枠で示すマップ全域の敵が対象。流線の先が吸引中心、金色の括弧は術者のバリアです。ここでのマップと発動は説明用です。</p><div class="stage"><canvas id="surface" width="980" height="620" aria-label="全域の敵に作用するグラビティストームの平面図"></canvas></div><div class="controls"><button id="replay" type="button">再生</button><button id="enable-audio" type="button">音を有効化</button><label><input id="source-on" type="checkbox" checked> 発動</label><label><input id="main-on" type="checkbox" checked> 効果</label><label><input id="observer-on" type="checkbox" checked> 光のアクセント</label><label><input id="eye-on" type="checkbox" checked> 術者バリア</label></div><p id="error" role="status" hidden></p><output id="state" aria-live="polite" style="position:absolute;left:-10000px"></output></main><script type="module" src="./gallery-adapter.mjs"></script></body></html>
