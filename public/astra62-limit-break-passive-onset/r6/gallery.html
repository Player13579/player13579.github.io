<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limit Break Passive Onset R6 Gallery</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}[data-gallery-status]{position:fixed;left:8px;bottom:8px;max-width:calc(100% - 32px);padding:6px 8px;color:#fff;background:#000c;font:12px/1.4 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}[hidden]{display:none!important}
</style>
</head>
<body>
<canvas aria-label="Limit Break effect"></canvas>
<output data-gallery-status role="status" aria-live="polite">Starting gallery…</output>
<script type="module">
import {mountGalleryEffect} from './gallery-adapter.mjs?rev=71e36bd3';
mountGalleryEffect({
  versionId:'limit-break-passive-onset-sol61-r6',
  moduleUrl:'./onset.mjs?rev=f2ca37116ee261b46ddc8e02db21875ab1c27964',
  shaderUrl:'./effect.wgsl?rev=e997f385e41150d663e5e122643982afeabb40dc',
  fixture:'fighter',
  uniformBytes:32,
  uniformValues:({width,height,age,scale,reduced,live})=>[width,height,age,scale,+reduced,+live,0,0]
}).catch(error=>{
  const status=document.querySelector('[data-gallery-status]');
  status.hidden=false;status.textContent=String(error?.message??error);
});
</script>
</body>
</html>
