<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイターの投擲EC衝撃波・着弾解放 R1</title><style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#14242e;color:#ecf2ef}
body{max-width:760px;margin:auto;padding:24px}h1{font-size:1.5rem}p{max-width:44rem}
canvas{display:block;width:100%;height:clamp(180px,35vh,285px);box-sizing:border-box;background:#162a35;border:1px solid #42595d;border-radius:8px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;padding:.35rem .65rem}
label{display:inline-flex;align-items:center;gap:.3rem}output{display:block;margin-top:.65rem}pre{font:13px monospace;white-space:pre-wrap}
</style><main><h1>ファイターの投擲EC衝撃波・着弾解放 <small>R1</small></h1>
<p>ECを付加した投擲が着弾すると、小さな着地点の印から一つの波面が床を広がります。</p>
<canvas aria-label="表示許可された着地点を中心に広がるEC衝撃波"></canvas>
<div class="controls"><label>通知条件<select id="fixture"><option value="west">左に着弾・ECあり</option><option value="east">右に着弾・ECあり</option><option value="ordinary">着弾・ECなし</option><option value="flying">まだ飛行中</option><option value="blade">剣の衝撃波</option><option value="hidden">着地点非表示</option><option value="mismatch">別の投擲の通知</option></select></label>
<button id="play" disabled>着弾解放を再生</button><button id="stop" disabled>停止</button><label><input id="reduced" type="checkbox">動きを抑える</label><label><input id="sound" type="checkbox">音声</label></div>
<output id="state" role="status">WebGPUを準備中…</output><details><summary>描画情報</summary><pre id="receipt"></pre></details></main>
<script type="module" src="./preview.mjs?v=thrown-ec-impact-r1"></script></html>
