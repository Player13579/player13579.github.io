<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファイターの投擲EC衝撃波・着弾解放 R1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}[data-gallery-status]{position:fixed;left:8px;bottom:8px;max-width:calc(100% - 32px);padding:6px 8px;color:#fff;background:#000c;font:12px/1.4 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}[hidden]{display:none!important}
</style>
</head>
<body>
<canvas aria-label="ファイターの投擲EC衝撃波・着弾解放 R1"></canvas>
<output data-gallery-status role="status" aria-live="polite">Starting gallery…</output>
<script type="module">
import {mountGalleryEffect} from './gallery-adapter.mjs?v=thrown-ec-impact-gallery-embed-r1';
mountGalleryEffect({
  versionId:'fighter-thrown-ec-impact-astra62-r1',
  moduleUrl:'./impact.mjs',
  shaderUrl:'./effect.wgsl?rev=thrown-ec-impact-gallery-embed-r1',
  fixture:'west',
  uniformBytes:48,
  uniformValues:({width,height,age,scale,reduced,live})=>[width,height,age,scale,Number(reduced),Number(live),1,0,-51,4,0,0]
}).catch(error=>{
  const status=document.querySelector('[data-gallery-status]');
  status.hidden=false;status.textContent=String(error?.message??error);
});
</script>
</body>
</html>
