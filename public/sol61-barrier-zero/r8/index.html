<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barrier r8 runtime verification</title><style>html,body{margin:0;background:#10151a;color:#dce7f2;font:14px system-ui}main{max-width:1100px;margin:auto;padding:16px}canvas{display:block;width:min(980px,100%);height:auto;aspect-ratio:49/31;background:#10151a}button{margin:3px;padding:7px;background:#253543;color:#fff;border:1px solid #789;border-radius:4px}pre{white-space:pre-wrap;max-height:24vh;overflow:auto}</style><main><h1>Barrier r8</h1><p id="state">Starting WebGPU…</p><canvas id="surface" width="980" height="620" data-logical-width="980" aria-label="Barrier effect WebGPU surface"></canvas><p><button id="gesture">Enable finite SFX</button><button id="run">Run verification fixtures</button></p><div id="cases"></div><pre id="audit"></pre><script type="module">
import {createBarrierRuntime} from './runtime.mjs';
const verify=new URL(location.href).searchParams.has('verify'),canvas=document.querySelector('#surface'),state=document.querySelector('#state'),out=document.querySelector('#audit'),button=document.querySelector('#run');
const points=[0,20,90,160,300,430,550,649,650,1200,1700,1800,1835,1855,1920,2050,2250,2449,2450,3100,3400,3440,3540,3650,3750,3830,3879,3880,4599];
const at=ms=>ms<650?['create',ms]:ms<1800?['stable',ms-650]:ms<2450?['hit',ms-1800]:ms<3400?['stable',ms-2450]:ms<3880?['break',ms-3400]:['off',0];
const blobData=canvas=>new Promise((resolve,reject)=>canvas.toBlob(async b=>{if(!b){reject(Error('WebGPU canvas PNG snapshot unavailable'));return;}const bytes=new Uint8Array(await b.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));resolve(btoa(binary));},'image/png'));
try{
 const r=await createBarrierRuntime(canvas,{verification:verify});window.barrierR8=r;state.textContent=verify?'verify mode: audio forced to zero':'ordinary preview';document.querySelector('#gesture').onclick=()=>r.triggerGesture();
 button.onclick=async()=>{button.disabled=true;const timeline=[],diagnostics=[];try{
  for(const dual of[false,true])for(const ms of points){const[stage,ageMs]=at(ms),mode=dual?'combined':'main-only',settings=dual?{}:{receiver:false,points:false,near:false,cross:false,ghost:false};state.textContent=`GPU fixture ${timeline.length+1}/58 · ${mode} · ${ms}ms`;const submitted=await r.setCase({stage,ageMs,layout:{dual},settings}),png=await blobData(canvas);timeline.push({mode,timestampMs:ms,stage,ageMs,flags:submitted.flags,settingsSerial:submitted.settingsSerial,submitId:submitted.submitId,confirmedBy:submitted.confirmedBy,confirmedAfterLaterFrame:submitted.confirmedAfterLaterFrame,pngBase64:png});}
  const focus=[['sourceOFF',{stage:'hit',ageMs:55,settings:{source:false}}],['nearOFF',{stage:'hit',ageMs:55,settings:{near:false}}],['crossOFF',{stage:'hit',ageMs:55,settings:{cross:false}}],['ghostOFF',{stage:'hit',ageMs:55,settings:{ghost:false}}],['coverageOFF',{stage:'hit',ageMs:55,settings:{coverage:false}}],['receiverOFF',{stage:'hit',ageMs:55,settings:{receiver:false}}],['pointsOFF',{stage:'hit',ageMs:55,settings:{points:false}}],['frontOFF',{stage:'hit',ageMs:55,settings:{front:false}}],['rearOFF',{stage:'hit',ageMs:55,settings:{rear:false}}],['movedSourcesObserver',{stage:'hit',ageMs:55,camera:{sourceShift:[.08,.04],observerCenter:[12,-9]}}],['opaqueOccluder',{stage:'hit',ageMs:55,camera:{sourceShift:[.08,.04],observerCenter:[12,-9]},layout:{diagnosticOccluder:true}}],['expiry',{stage:'off',ageMs:0}]];
  for(const[name,spec]of focus){state.textContent=`GPU isolation ${diagnostics.length+1}/${focus.length} · ${name}`;const submitted=await r.setCase(spec);diagnostics.push({name,...submitted});}
  const adapterInfo=r.adapter.info?{vendor:r.adapter.info.vendor,architecture:r.adapter.info.architecture,device:r.adapter.info.device,description:r.adapter.info.description}:null,report={id:'sol61-barrier-zero-r8',verification:true,url:location.href,canvas:{width:canvas.width,height:canvas.height,dpr:1},adapter:adapterInfo,contract:{source:'frozen design-manifest.json',artistFiles:23,frameABI:'128 bytes; compile-only field token normalization layout→frameLayout',passes:['three scene MRTs','main-only','combined optics','full29 phases','source/near/cross/ghost/coverage/receiver/points/front/rear OFF','moved source/observer','real opaque diagnostic occluder','expiry']},timeline,diagnostics,gpuErrors:r.audit.gpuErrors,audio:r.audit.audio,quality:'not_run by runtime owner',listening:'not_run',gameIntegration:'not_run',public:'not_run',adoption:'unadopted'};
  out.textContent='Saving 58 native canvas captures and submit logs…';const response=await fetch('./capture',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(report)});if(!response.ok)throw Error(`Evidence save rejected ${response.status}: ${await response.text()}`);const receipt=await response.json();window.barrierFixtureResults={receipt,report:{...report,timeline:timeline.map(({pngBase64,...x})=>x)}};state.textContent=`GPU fixture suite complete · ${timeline.length} saved frames`;out.textContent=JSON.stringify({receipt,canvas:report.canvas,adapter:report.adapter,timeline:timeline.length,phases:points.length,modes:['main-only','combined'],diagnostics:diagnostics.map(x=>x.name),confirmed:timeline.every(x=>x.confirmedAfterLaterFrame),gpuErrors:r.audit.gpuErrors,audio:r.audit.audio},null,2);
 }catch(e){out.textContent=String(e?.stack??e);state.textContent='Fixture/evidence run failed';}finally{button.disabled=false;}};
 out.textContent=JSON.stringify(r.audit,null,2);
}catch(e){state.textContent='WebGPU startup failed: '+e.message;out.textContent=e.stack;}
</script></main></html>
