</style></head><body><main><h1>Barrier · GPT-6.1-Sol r9</h1><p id="status">Starting WebGPU…</p><canvas id="surface" width="980" height="620" data-logical-width="980" data-actor-height="64" aria-label="Barrier effect WebGPU surface"></canvas><div id="controls"><button id="create">Create 0 ms</button><button id="stable">Stable</button><button id="hit">Known hit 55 ms</button><button id="unknown">Unknown hit 55 ms</button><button id="break">Break 0 ms</button><button id="off">Off</button><button id="continuous">Continuous 4.6 s</button><button id="sound">Enable ordinary finite SFX</button><label><input type="checkbox" id="dual">dual dark/light compare</label></div><pre id="audit"></pre></main>
<script type="module">
import {createBarrierRuntime} from './runtime.mjs';
const q=new URL(location.href).searchParams,verify=q.has('verify'),embed=q.has('embed');if(embed)document.body.classList.add('embed');
const canvas=document.querySelector('#surface'),status=document.querySelector('#status'),audit=document.querySelector('#audit');
try{
 const r=await createBarrierRuntime(canvas,{verification:verify,embedded:embed});
 status.textContent=verify?'Verification mode · audio permanently zero':'Ordinary local preview · sound waits for user gesture';
 const show=async spec=>{const submitted=await r.setCase(spec);audit.textContent=JSON.stringify({submitted:r.snapshot().lastSubmitted,adapter:r.snapshot().adapter,audio:r.snapshot().audio},null,2);return submitted;};
 document.querySelector('#create').onclick=()=>show({stage:'create',ageMs:0});
 document.querySelector('#stable').onclick=()=>show({stage:'stable'});
 document.querySelector('#hit').onclick=()=>show({stage:'hit',ageMs:55,known:true,contact:[.50,.15,.66]});
 document.querySelector('#unknown').onclick=()=>show({stage:'hit',ageMs:55,known:false});
 document.querySelector('#break').onclick=()=>show({stage:'break',ageMs:0,owner:{barrierDurability:0}});
 document.querySelector('#off').onclick=()=>show({stage:'off'});
 document.querySelector('#sound').onclick=async()=>{const ok=await r.sound?.unlock();status.textContent=`Ordinary audio unlocked: ${!!ok}`;};
 document.querySelector('#dual').onchange=e=>{r.setLayout({dual:e.target.checked});};
 document.querySelector('#continuous').onclick=async()=>{
   const button=document.querySelector('#continuous');button.disabled=true;
   try{const begin=performance.now(),frames=[];let recorder=null,chunks=[];if(canvas.captureStream&&globalThis.MediaRecorder){const stream=canvas.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.start();}
     while(performance.now()-begin<4600){const x=performance.now()-begin;let stage,age;if(x<650){stage='create';age=x;}else if(x<1800){stage='stable';age=x-650;}else if(x<2450){stage='hit';age=x-1800;}else if(x<3400){stage='stable';age=x-2450;}else if(x<3880){stage='break';age=x-3400;}else{stage='off';age=0;}
       r.setState(stage==='stable'?{stage:1,t:0,live:true,known:false,contact:[0,0,0]}:stage==='off'?{stage:4,t:0,live:false,known:false,contact:[0,0,0]}:{stage:{create:0,hit:3,break:2}[stage],t:age/1000,live:true,known:stage==='hit',contact:stage==='hit'?[.50,.15,.66]:[0,0,0]});
       const s=await r.submit();if(frames.length===0||s.submitId!==frames.at(-1).submitId)frames.push({cycleMs:Math.round(x),stage,ageMs:Math.round(age),submitId:s.submitId,live:s.live,flags:s.flags});await new Promise(requestAnimationFrame);
     }
     if(recorder){await new Promise(resolve=>{recorder.onstop=resolve;recorder.stop();});const blob=new Blob(chunks,{type:recorder.mimeType}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='barrier-r9-continuous.webm';a.textContent='Download native continuous recording';a.style.display='inline-block';a.style.color='#cde';document.querySelector('#controls').append(a);}
     audit.textContent=JSON.stringify({continuousCycleMs:4600,frameSubmissions:frames.length,first:frames.slice(0,3),last:frames.slice(-3),adapter:r.snapshot().adapter,errors:r.snapshot().gpuErrors,verification:verify,audio:r.snapshot().audio},null,2);
   }catch(e){audit.textContent=String(e?.stack??e);}finally{button.disabled=false;}
 };
 window.__barrierR9=r;window.__runBarrierR9Fixture=show;
 audit.textContent=JSON.stringify(r.snapshot(),null,2);
}catch(e){status.textContent=`WebGPU startup failed: ${e.message}`;audit.textContent=String(e?.stack??e);window.__barrierR9Failure=String(e?.stack??e);}
</script></body></html>
