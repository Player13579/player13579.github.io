<!doctype html>
<html lang="ja">
<head>

  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>食堂・環境E試作 r2</title>
  <style>
    :root{color-scheme:dark;background:#101820;color:#f2f3f4;font:13px/1.4 system-ui,sans-serif}

  </style>
</head>
<body>
  <canvas id="stage" aria-label="採用済み食堂画像上の環境E試作 r2"></canvas>

</html>
