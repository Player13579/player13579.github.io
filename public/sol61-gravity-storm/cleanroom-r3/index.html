<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Gravity Storm cleanroom R3</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;background:#101216;color:#e4e8ec}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:980px;margin:0 auto}h1{margin:0 0 8px;font-size:18px;font-weight:650}p{margin:0 0 14px;color:#aab2bc}.stage{width:980px;height:620px;background:#080b10;overflow:auto}canvas{display:block;width:980px;height:620px;background:#080b10}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}button{border:1px solid #4b5968;border-radius:5px;background:#202833;color:#eef3f8;padding:7px 12px}label{display:inline-flex;align-items:center;gap:5px}#error{color:#ffaaa5;white-space:pre-wrap}</style></head>
