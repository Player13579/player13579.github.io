<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Special Ammo cleanroom R2</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;background:#101216;color:#e4e8ec}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:980px;margin:0 auto}h1{margin:0 0 8px;font-size:18px;font-weight:650}p{margin:0 0 14px;color:#aab2bc}.stage{width:980px;height:620px;background:#080b10;overflow:auto}canvas{display:block;width:980px;height:620px;background:#080b10}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}button,select{border:1px solid #4b5968;border-radius:5px;background:#202833;color:#eef3f8;padding:7px 12px}label{display:inline-flex;align-items:center;gap:5px}#error{color:#ffaaa5;white-space:pre-wrap}</style></head>
<body><main><h1>Special Ammo cleanroom R2</h1><p>Synthetic receipt preview for load, shot, or contact. Contact is a localized signal only; no target-body outcome or gameplay state is represented.</p><div class="stage"><canvas id="surface" width="980" height="620" aria-label="Special Ammo effect preview"></canvas></div><div class="controls"><label>Variant <select id="variant"></select></label><label>Weapon <select id="weapon"><option value="handgun">Handgun</option><option value="smg">SMG</option><option value="assault">Assault</option><option value="sniper">Sniper</option><option value="taser">Taser</option></select></label><button id="replay" type="button">Create synthetic receipt / Replay</button><label><input id="loop-on" type="checkbox" checked> loop after 600 ms</label><button id="enable-audio" type="button">Enable sound</button><label><input id="source-on" type="checkbox" checked> source</label><label><input id="main-on" type="checkbox" checked> main</label><label><input id="observer-on" type="checkbox" checked> observer</label></div><p id="error" role="status" hidden></p><output id="state" aria-live="polite" style="position:absolute;left:-10000px"></output></main><script type="module" src="./gallery-adapter.mjs"></script></body></html>
