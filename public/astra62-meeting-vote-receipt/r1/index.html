<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票受理 R1</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#17232b;color:#edf3f2}
body{max-width:760px;margin:0 auto;padding:24px}h1{font-size:1.5rem}p{max-width:42rem}
canvas{display:block;background:#17232b;width:100%;height:clamp(180px,35vh,285px);border:1px solid #42535a;border-radius:8px;box-sizing:border-box}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{padding:.45rem .9rem;font:inherit}label{display:inline-flex;align-items:center;gap:.2rem}
output{display:block;margin-top:.7rem}pre{font:13px/1.4 monospace;white-space:pre-wrap}
</style>
<main><h1>投票受理 <small>R1</small></h1><p>会議で自分の投票が受理された瞬間を再生します。投票先は表示しません。</p>
<canvas aria-label="無記名の紙片が受付口に収まり、縁の光が消える"></canvas>
<div class="controls"><button id="play" disabled>受理を再生</button><button id="stop" disabled>停止</button><label><input id="reduced" type="checkbox">動きを抑える</label><label><input id="sound" type="checkbox">音声</label></div>
<output id="state" role="status">WebGPUを準備中…</output>
<details><summary>描画情報</summary><pre id="receipt"></pre></details></main>
<script type="module" src="./preview.mjs"></script></html>
