<head>

<title>会議の投票受理 R1</title>
<style>

<body>
<canvas aria-label="会議の投票受理 R1"></canvas>
<output data-gallery-status role="status" aria-live="polite">Starting gallery…</output>
<script type="module">
import {mountGalleryEffect} from './gallery-adapter.mjs?v=meeting-vote-gallery-embed-r1';
mountGalleryEffect({
  versionId:'meeting-vote-receipt-astra62-r1',
  moduleUrl:'./gallery-effect.mjs?rev=meeting-vote-gallery-embed-r1',
  shaderUrl:'./effect.wgsl?rev=meeting-vote-gallery-embed-r1',
  fixture:'accepted',
  uniformBytes:32,
  uniformValues:({width,height,age,scale,reduced,live})=>[width,height,age,scale,Number(reduced),Number(live),0,0]
}).catch(error=>{
  const status=document.querySelector('[data-gallery-status]');
  status.hidden=false;status.textContent=String(error?.message??error);
});
</script>
