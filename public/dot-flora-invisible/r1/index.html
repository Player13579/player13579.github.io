<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フローラ・インビジブル候補</title>
<style>body{font:16px system-ui;background:#10151c;color:#e6ecf4;margin:24px}main{max-width:980px;margin:auto}canvas{width:100%;aspect-ratio:980/620;background:#080d14;border:1px solid #344454}button,label{margin:5px;padding:8px}#status{min-height:2em}</style>
<main><h1>フローラ・インビジブル開始E</h1><p>独立候補。本人限定の1600ms開始合図。ヒール・サンビームとは別系列。GPU・画質・音質は未審査です。</p>
<canvas width="980" height="620"></canvas><p><button id="start">GPU準備・再生</button><button id="stop">停止</button><button id="hold">800msで保持</button><label><input id="reduced" type="checkbox">動きを減らす</label><label><input id="muted" type="checkbox">消音</label></p><p id="status" role="status">自動起動しません。</p><p>人物なしの現象プレビュー。実キャラの位置・遮蔽、公開ギャラリー接続は未検証です。</p></main><script type="module" src="./preview.mjs"></script></html>
