<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Bust WebGPU Preview</title><style>:root,html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#121b25}#surface{display:block;width:100%;height:100%;border:0}#error{position:fixed;inset:0 auto auto 0;z-index:2;max-width:100%;padding:10px 12px;background:#351a20;color:#fff0f0;font:14px/1.45 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><canvas id="surface" aria-label="Bust WebGPU preview"></canvas><div id="error" role="alert" hidden></div><script>const reveal=e=>{const p=document.getElementById('error');p.textContent=String(e?.stack||e?.message||e);p.hidden=false;document.body.dataset.failed='true'};window.addEventListener('error',e=>reveal(e.error||e.message));window.addEventListener('unhandledrejection',e=>reveal(e.reason));window.__dvaBustGalleryError=reveal;</script><script type="module" src="./gallery-adapter.mjs"></script></body></html>
