<script type="module">import{createController,createGallerySfxAdapter,REVISIONS,WEAPONS}from'./controller.mjs';const params=new URLSearchParams(location.search),revision='r5',requested=params.get('weapon')||'handgun',canonical=REVISIONS[revision].versionId,outerVersion=params.get('galleryVersionId')||canonical,outerEpoch=Number(params.get('galleryAttemptEpoch')),outerToken=params.get('galleryStartupToken')||'';if(!WEAPONS.includes(requested)||outerVersion!==canonical||(outerToken&&(!Number.isSafeInteger(outerEpoch)||outerEpoch<1)))throw Error('invalid unified shooting startup identity');const identity=outerToken?{token:outerToken,versionId:outerVersion,attemptEpoch:outerEpoch}:null;const api=createController({document,location,parentWindow:window,topWindow:window.parent,outerIdentity:identity,outerExpected:{revision,weapon:requested}});document.querySelector('#revision').value=revision;document.querySelector('#weapon').value=requested;document.querySelector('#version-id').textContent=canonical;window.__dvaShootingUnified=api;window.childVerify=params.has('verify');window.__gallerySfx=createGallerySfxAdapter(api);if(identity){window.addEventListener('message',event=>{const d=event.data;if(event.source!==window.parent||event.origin!==location.origin||d?.schema!=='dva-gallery-startup/v1'||d.action!=='retire'||d.token!==identity.token||d.versionId!==identity.versionId||d.attemptEpoch!==identity.attemptEpoch)return;void api.dispose({notifyParent:true}).catch(()=>{})});}void api.select({revision,weapon:requested}).catch(e=>{document.querySelector('#status').textContent=String(e.message||e)});addEventListener('pagehide',()=>{void api.dispose()},{once:true});</script></html>
