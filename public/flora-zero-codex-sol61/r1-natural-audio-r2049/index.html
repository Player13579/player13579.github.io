<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Flora — 光学迷彩 zero R1</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111711; color: #e8eee8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, footer { padding: .75rem 1rem; background: #172019; border-color: #334234; }
    header { border-bottom: 1px solid #334234; }
    footer { border-top: 1px solid #334234; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
    h1 { font-size: 1rem; margin: 0; font-weight: 650; }
    #scope { margin: .3rem 0 0; font-size: .8rem; color: #bac8b8; }
    main { position: relative; background: #101711; }
    canvas { display: block; }
    button, label { font: inherit; }
    button { border: 1px solid #73866d; border-radius: .45rem; padding: .45rem .75rem; color: inherit; background: #28372a; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem .9rem; }
    #status { margin-left: auto; font: .8rem ui-monospace, monospace; color: #c5d8c1; }
    @media (max-width: 600px) { #status { width: 100%; margin-left: 0; } }
  </style>
</head>
<body>
  <header>
    <h1>Flora — 光学迷彩 zero R1</h1>
    <p id="scope">ギャラリー用プレビュー。ゲーム内接続・品質受入・通常聴感の証明ではありません。</p>
  </header>
  <main><canvas id="flora-zero" aria-label="Flora WebGPU preview"></canvas></main>
  <footer>
    <button id="play" type="button">再生</button>
    <button id="stop" type="button" disabled>停止</button>
    <button id="retire" type="button">終了</button>
    <fieldset aria-label="診断表示">
      <label><input id="source" type="checkbox" checked> 発光源</label>
      <label><input id="observer" type="checkbox" checked> 観測</label>
      <label><input id="near" type="checkbox" checked> 近接受光</label>
      <label><input id="background" type="checkbox"> 明るい背景</label>
    </fieldset>
    <button id="sound" type="button">音声を有効化</button>
    <button id="mute" type="button">消音</button>
    <output id="status" aria-live="polite">待機中</output>
  </footer>
  <script type="module" src="./preview-control.mjs"></script>
</body>
</html>
