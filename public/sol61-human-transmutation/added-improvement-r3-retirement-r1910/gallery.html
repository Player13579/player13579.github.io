<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人体生成 · GPT-6.1-Sol 追加改善 R3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151c23}iframe{display:block;width:100%;height:100%;border:0}</style>
<iframe id="source" title="人体生成 GPT-6.1-Sol 追加改善 R3"></iframe>
<script type="module">
import {observeHumanCanvas} from './human-canvas-fit.mjs';
import {isParentStartup,acceptsRetire} from './gallery-auth.mjs';
import {createHumanR3RetirementPayload} from './human-r3-retirement-envelope.mjs';
const versionId='human-transmutation-added-improvement-sol61-r3';
const currentOwner='human-transmutation-added-improvement-sol61-r3';
const query=new URLSearchParams(location.search),outer=window.parent;
const token=query.get('galleryStartupToken'),epoch=Number(query.get('galleryAttemptEpoch'));
const parentStartup=isParentStartup({isEmbedded:outer!==window,token,requestedVersion:query.get('galleryVersionId'),versionId,epoch});
let sequence=0,disposed=false,retiring=false,snapshot=null,stage='child-document',acceptedFrame=null;
const packageSchema=query.get('galleryPackageSchema'),packageManifestSha256=query.get('packageManifestSha256'),packageSealSha256=query.get('packageSealSha256');
const sourceSha256='4f1901dfd275bfec01b6f4fd7da66f190e0b2396320de2fb36cc20a5e36490a3';
function emit(nextStage,status,extra={}){
  stage=nextStage;
  const message={schema:'dva-gallery-startup/v1',token,versionId,attemptEpoch:epoch,sequence:++sequence,stage,status,packageSchema,packageManifestSha256,packageSealSha256,...extra};
  snapshot=Object.freeze(message);
  if(parentStartup)outer.postMessage(message,location.origin);
  return message;
}
if(parentStartup){window.__dvaGalleryStartupSnapshot=()=>snapshot;window.__humanCanvasFitSnapshot=geometrySnapshot;emit('child-document','pending',{currentOwner});}
const childUrl=new URL('./index.html',location.href);
for(const [key,value] of query)if(!['galleryStartupToken','galleryVersionId','galleryAttemptEpoch'].includes(key))childUrl.searchParams.set(key,value);
// Parent startup verification keeps the creative's authored sound muted.
if(parentStartup&&query.has('verify'))childUrl.searchParams.set('verify','');
const child=document.getElementById('source');
child.src=childUrl.href;
function humanGeometry(state){
  const win=child.contentWindow,canvas=child.contentDocument?.querySelector('canvas#stage');
  const rect=canvas?.getBoundingClientRect();
  const dpr=win?.devicePixelRatio;
  return observeHumanCanvas({state,canvas,rect,dpr,versionId,currentOwner,expectedOwner:currentOwner,frameUrl:win?.location?.href});
}
function geometrySnapshot(){
  const state=child.contentWindow?.__human?.getState?.();
  try{return Object.freeze({status:'geometry-fit',...humanGeometry(state)});}
  catch(error){
    const canvas=child.contentDocument?.querySelector('canvas#stage'),rect=canvas?.getBoundingClientRect();
    return Object.freeze({status:'failed-geometry',versionId,currentOwner,frameUrl:child.contentWindow?.location?.href||null,
      canvas:rect?{rect:{left:rect.left,top:rect.top,width:rect.width,height:rect.height},backingExtent:canvas?[canvas.width,canvas.height]:null}:null,
      canvasRect:rect?{left:rect.left,top:rect.top,width:rect.width,height:rect.height}:null,
      backingExtent:canvas?[canvas.width,canvas.height]:null,dpr:child.contentWindow?.devicePixelRatio||null,error:String(error?.message||error)});
  }
}
function validCompletedFrame(state){try{humanGeometry(state);return true;}catch(_){return false;}}

async function waitForFirstFrame(){
  if(!parentStartup)return;
  emit('first-frame','pending',{currentOwner});
  const deadline=performance.now()+9000;
  try{
    while(!disposed&&performance.now()<deadline){
      const win=child.contentWindow;
      if(win?.__humanError)throw new Error(String(win.__humanError));
      const state=win?.__human?.getState?.();
      if(state?.fatal)throw new Error(String(state.fatal));
      if(state?.ready===true&&!state.fatal){
        // The preview sets ready before its first queue submission completes. A null
        // receipt is therefore pending; only a real receipt is eligible for the
        // strict geometry/current-cause/generation/queue checks below.
        const r=state.receipt;
        if(!r){await new Promise(resolve=>setTimeout(resolve,40));continue;}
        const canvas=child.contentDocument.querySelector('canvas#stage'),geometry=humanGeometry(state);
        if(r.version!=='human-transmutation-added-improvement-sol61-r3'||r.sourceSha256!==sourceSha256||r.targetId!=='revived-philia'||!Number.isSafeInteger(r.submitted)||r.submitted<=0||r.completed!==r.submitted||r.queueCompleted!==true||!Number.isSafeInteger(r.generation)||r.generation<0||typeof r.causeId!=='string'||!r.causeId)throw new Error('R3 source receipt is not exact, complete and current');
        const proof={canvasGeometry:geometry,recorded:true,submitted:true,completed:true,canvasConnected:true,
          canvasWidth:canvas.width,canvasHeight:canvas.height,passes:r.passes,viewportWidth:r.cssExtent[0],viewportHeight:r.cssExtent[1],
          physicalWidth:r.physicalExtent[0],physicalHeight:r.physicalExtent[1],dpr:r.dpr,causeId:r.causeId,generation:r.generation,
          sourceSubmissionId:r.submitted,submittedCount:r.submitted,completedCount:r.completed,queueCompleted:r.queueCompleted,sourceVersionId:r.version,sourceOwner:currentOwner,
          sourceSha256:r.sourceSha256,targetId:r.targetId,scopeId:r.scopeId,elapsedMs:r.elapsedMs,verify:state.verify};
        acceptedFrame=emit('playing','ready',{currentOwner,fitGeometry:geometry,firstFrame:proof});
        return;
      }
      await new Promise(resolve=>setTimeout(resolve,40));
    }
    if(!disposed)throw new Error('Timed out waiting for the source preview completed first WebGPU frame.');
  }catch(error){if(!disposed)emit('first-frame','error',{currentOwner,error:{code:'HUMAN_R6_FIRST_FRAME_FAILED',message:error?.message||String(error)}});}
}
child.addEventListener('load',()=>{void waitForFirstFrame();});
window.addEventListener('message',event=>{
  if(!acceptsRetire({parentStartup,eventOrigin:event.origin,ownOrigin:location.origin,eventSource:event.source,parentWindow:outer,
    data:event.data,token,versionId,epoch}))return;
  if(retiring||!acceptedFrame||!child.isConnected)return;
  retiring=true;
  const initial=acceptedFrame.firstFrame;
  const expected={origin:location.origin,route:new URL(location.href).pathname,versionId,token,attemptEpoch:epoch,packageSchema,packageManifestSha256,packageSealSha256,
    targetId:initial.targetId,scopeId:initial.scopeId,sourceSha256:initial.sourceSha256,acceptedCauseId:initial.causeId,acceptedGeneration:initial.generation,acceptedSequence:acceptedFrame.sequence};
  const disposeForGallery=child.contentWindow?.__human?.disposeForGallery;
  if(typeof disposeForGallery!=='function'){emit('retiring','error',{action:'retire-error',error:{code:'HT_R3_RETIREMENT_API_MISSING',message:'Actual source drain API is unavailable'}});return;}
  void Promise.resolve(disposeForGallery.call(child.contentWindow.__human,expected)).then(proof=>{
    const payload=createHumanR3RetirementPayload(expected,acceptedFrame,proof);
    emit('retired','ready',payload);
  }).catch(error=>emit('retiring','error',{action:'retire-error',error:{code:'HT_R3_RETIREMENT_FAILED',message:String(error?.message||error)}}));
});
window.addEventListener('pagehide',()=>{disposed=true;},{once:true});
window.__gallerySfx=Object.freeze({
  async activateFromGesture(){
    if(query.has('verify')||child.contentWindow?.location.search.includes('verify'))return {state:'silent',reason:'verification mode'};
    const win=child.contentWindow,doc=child.contentDocument,control=doc?.getElementById('audio'),unlock=win?.__human?.unlockAudioFromGesture;
    if(!win?.__human||!control||control.disabled||typeof unlock!=='function')return {state:'unavailable',reason:'source preview audio unlock is unavailable'};
    // Call the child API synchronously in the parent gesture stack. Unlocking does not
    // start a voice; the child waits for a matching completed cause/generation receipt.
    const unlocking=unlock.call(win.__human);
    const ok=await unlocking;
    if(ok)return {state:'active',reason:'source preview audio context unlocked; authored SFX waits for its completed source frame'};
    if(win.__human.getState().audio?.verify)return {state:'silent',reason:'verification mode'};
    return {state:'unsupported',reason:'source preview did not unlock authored audio'};
  }
});
</script>
