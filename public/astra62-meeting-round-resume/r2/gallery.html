<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会議集計後のラウンド再開 R2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}[data-gallery-status]{position:fixed;left:8px;bottom:8px;max-width:calc(100% - 32px);padding:6px 8px;color:#fff;background:#000c;font:12px/1.4 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}[hidden]{display:none!important}
</style>
</head>
<body>
<canvas aria-label="会議集計後のラウンド再開 R2"></canvas>
<output data-gallery-status role="status" aria-live="polite">Starting gallery…</output>
<script type="module">
import {digitSlots} from './resume.mjs';
import {mountGalleryEffect} from './gallery-adapter.mjs?v=meeting-round-resume-gallery-embed-r2';
const from=1,to=2;
mountGalleryEffect({
  versionId:'meeting-round-resume-astra62-r2',
  moduleUrl:'./resume.mjs',
  shaderUrl:'./effect.wgsl?rev=meeting-round-resume-gallery-embed-r2',
  fixture:'small',
  uniformBytes:160,
  uniformValues:({width,height,age,scale,reduced,live})=>[width,height,age,scale,Number(reduced),Number(live),String(to).length,0,...digitSlots(from),...digitSlots(to)]
}).catch(error=>{
  const status=document.querySelector('[data-gallery-status]');
  status.hidden=false;status.textContent=String(error?.message??error);
});
</script>
</body>
</html>
