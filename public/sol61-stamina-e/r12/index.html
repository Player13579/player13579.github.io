<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stamina r12 preview</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #101510; color: #edf2ec; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(100vw, 620px); padding: 16px; box-sizing: border-box; }
    canvas { display: block; width: 100%; height: 260px; background: #101510; touch-action: manipulation; }
    p { margin: 10px 0 0; color: #b9c7ba; }
    #status[data-error="true"] { color: #ffb6a8; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="stamina" aria-label="Stamina r12 WebGPU preview"></canvas>
    <p id="status" role="status" aria-live="polite">WebGPU preview starting.</p>
    <p class="sr-only">音を有効にするには画面を操作してください。verifyモードでは音声を再生しません。</p>
  </main>
  <script type="module" src="./index.mjs"></script>
</body>
</html>
