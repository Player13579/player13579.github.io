<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stamina r13 runtime host</title>
  <style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101720}iframe{width:100%;height:100%;display:block;border:0}</style>
</head>
<body>
  <iframe id="stamina" title="スタミナ補給E r13"></iframe>
  <script>
    const search=new URLSearchParams(location.search);
    const target=new URL('./index.html',location.href);
    target.searchParams.set('embed','1');
    for(const key of ['verify','capture','gpu-check'])if(search.has(key))target.searchParams.set(key,search.get(key)||'1');
    const frame=document.getElementById('stamina');
    frame.src=target.href;
    Object.defineProperty(window,'__staminaR13',{get:()=>frame.contentWindow.__staminaR13});
    Object.defineProperty(window,'__gallerySfx',{get:()=>frame.contentWindow.__gallerySfx});
  </script>
</body>
</html>
