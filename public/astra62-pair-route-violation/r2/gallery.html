<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ペア行動禁止違反の成立通知 R2</title>
  <style>
    html,body,main{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    canvas{display:block;width:100%;height:100%}
    [data-gallery-status],#gallery-status,#gallery-error{position:fixed;left:8px;bottom:8px;max-width:calc(100% - 32px);padding:6px 8px;color:#fff;background:#000c;font:12px/1.4 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main id="pair-route-violation-astra62-r2" aria-label="ペア行動禁止違反の成立通知 R2">
    <canvas aria-label="ペア行動禁止違反の成立通知 R2"></canvas>
    <p data-gallery-status id="gallery-status" role="status" aria-live="polite">準備中</p>
    <pre id="gallery-error" role="alert" hidden></pre>
  </main>
  <script type="module">
    import { mountGalleryEffect } from './gallery-adapter.mjs?gitBlob=8cbc7faa43279e6efedc00c529be0dee88188aa7';
    const status = document.getElementById('gallery-status');
    const error = document.getElementById('gallery-error');
    try {
      await mountGalleryEffect({
        versionId: 'pair-route-violation-astra62-r2',
        moduleUrl: './violation.mjs?gitBlob=a42ef239fe50ee4f7ead6a57aa03ff78c026d7bf',
        shaderUrl: './effect.wgsl?gitBlob=a9f13b0f6411956a72cd3ec19b5b69965203369c',
        fixture: 'confirmed',
        uniformBytes: 48,
        firstFrameAgeMs: [105,640],
        uniformValues: ({width, height, age, scale, reduced, live}) => [width, height, age, scale, Number(reduced), Number(live), 1, 0, 0, 14, 0, 0],
        statusElement: status,
        errorElement: error
      });
    } catch (cause) {
      error.hidden = false;
      error.textContent = String(cause && cause.message || cause);
      status.hidden = true;
    }
  </script>
</body>
</html>
