<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>共通錬気 r4 — gallery WebGPU content view</title>
  <style>
    :root{color-scheme:dark;background:#111922}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#111922}
    body{padding:0;max-width:none}
    h1,.notice,.controls,#status,#diagnostics,.small{display:none!important}
    .stage{position:fixed;inset:0;border:0;border-radius:0;overflow:hidden;background:#111922}
    #view{display:block;width:100vw;height:100vh;height:100dvh;max-height:none;touch-action:none}
  </style>
</head>
<body>
  <h1>共通錬気 r4</h1>
  <p class="notice">Gallery content-only adapter. Standalone local fixture; game connection is unavailable.</p>
  <div class="stage"><canvas id="view" aria-label="Common ki R4 WebGPU preview"></canvas></div>
  <div class="controls">
    <button id="play">Play</button><button id="pause">Pause</button><button id="render">Render</button>
    <label>age <input id="age" type="range" min="0" max="1200" step="1" value="640"><output id="ageOut">640</output></label>
    <select id="height"><option value="actual">actual</option><option value="64">H64</option></select>
    <input id="source" type="checkbox" checked><input id="nearby" type="checkbox" checked>
    <input id="observer" type="checkbox" checked><select id="variant"><option value="">ordinary</option><option value="tenfold">tenfold</option></select>
  </div>
  <p id="status" role="status">WebGPU starting</p>
  <p id="error" role="alert" hidden></p>
  <pre id="diagnostics">diagnostics</pre>
  <p class="small">Visual autoloop is independent of audio. Normal SFX requires a gallery gesture and same-cycle submitted proof; verify URLs stay silent.</p>
  <script src="./package/webgpu-player-sprite.js"></script>
  <script type="module" src="./package/preview-gallery-r2.mjs"></script>
  <script>
    (()=>{
      const record=window.__commonKiGalleryAutoLoop={mode:'normal-gallery; parent verify propagates only when present',state:'waiting-for-webgpu',startedAt:null};
      const status=document.querySelector('#status'),error=document.querySelector('#error');
      const poll=()=>{
        if(document.hidden){requestAnimationFrame(poll);return;}
        const value=status?.textContent||'';
        if(window.__galleryVisual?.ready){
          if(!window.__galleryVisual.active){window.__galleryVisual.start();record.state='running';record.startedAt??=performance.now();}
          requestAnimationFrame(poll);return;
        }
        if(value.startsWith('WebGPU preview failed')||value.startsWith('Device lost:')){
          record.state='failed';record.error=value;error.textContent=value;error.hidden=false;return;
        }
        requestAnimationFrame(poll);
      };
      requestAnimationFrame(poll);
    })();
  </script>
</body>
</html>
