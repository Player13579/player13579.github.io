<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>共通錬気 R5 — gallery WebGPU view</title><style>:root{color-scheme:dark;background:#111922}*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#111922}body{padding:0;max-width:none}h1,.notice,.controls,#status,#diagnostics,.small{display:none!important}.stage{position:fixed;inset:0;border:0;border-radius:0;overflow:hidden;background:#111922}#view{display:block;width:100vw;height:100vh;height:100dvh;max-height:none;touch-action:none}</style></head><body><h1>共通錬気 R5</h1><p class="notice">Independent R5 WebGPU fixture. No game receipt, producer, recipient, or main-game connection.</p><div class="stage"><canvas id="view" aria-label="Common Ki R5 WebGPU preview"></canvas></div><div class="controls"><button id="play">連続再生</button><button id="pause">停止</button><button id="render">現在値を描画</button><label>phase E ms <input id="age" type="range" min="0" max="1200" step="1" value="640"><output id="ageOut">640</output></label><label>fixture H <select id="height"><option value="actual">male-right-walk actual</option><option value="64">H64 comparison</option></select></label><label>source <input id="source" type="checkbox" checked></label><label>nearby <input id="nearby" type="checkbox" checked></label><label>OBS <input id="observer" type="checkbox" checked></label><label>variant <select id="variant"><option value="">ordinary</option><option value="tenfold">tenfold</option></select></label></div><p id="status" role="status">WebGPU starting</p><p id="error" role="alert" hidden></p><pre id="diagnostics">diagnostics</pre><p class="small">Visual autoplay is independent of audio. Normal SFX requires the existing gallery gesture bridge and per-cycle submitted proof; verification URLs remain silent.</p><script src="./package/webgpu-player-sprite.js"></script><script type="module" src="./package/preview-gallery-r1.mjs"></script><script>(()=>{const record=window.__commonKiR5GalleryAutoLoop={mode:'normal gallery; parent verify propagates only when present',state:'waiting-for-webgpu',startedAt:null};const status=document.querySelector('#status'),error=document.querySelector('#error');const poll=()=>{if(document.hidden){requestAnimationFrame(poll);return;}const value=status?.textContent||'';if(window.__galleryVisual?.ready){if(!window.__galleryVisual.active){window.__galleryVisual.start();record.state='running';record.startedAt??=performance.now();}requestAnimationFrame(poll);return;}if(value.startsWith('WebGPU preview failed')||value.startsWith('Device lost:')){record.state='failed';record.error=value;error.textContent=value;error.hidden=false;return;}requestAnimationFrame(poll);};requestAnimationFrame(poll);})();</script></body></html>
