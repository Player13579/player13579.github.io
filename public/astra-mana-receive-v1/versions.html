<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マナ受領 — Astra 全試作版</title>
<style>body{margin:0;background:#121927;color:#e3eafa;font:14px system-ui}header{padding:16px 20px}h1{font-size:20px;margin:0 0 5px}main{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;padding:0 16px 16px}iframe{width:100%;height:520px;border:0;background:#080d17;border-radius:10px}aside{display:flex;flex-direction:column;gap:8px}button{padding:10px;border:1px solid #4a5a74;border-radius:7px;background:#202d44;color:inherit;text-align:left;cursor:pointer}button[aria-pressed=true]{border-color:#86c9ff;background:#294565}#detail{font-size:12px;line-height:1.6;color:#c1cce0}small{color:#9facc2}@media(max-width:700px){main{grid-template-columns:minmax(0,1fr) 155px;padding:0 7px;gap:7px}iframe{height:450px}button{padding:7px;font-size:12px}}</style>
<header><h1>マナ受領 — Astra 全試作版</h1><small>全版未採用。不採用版も履歴を保持し、そのまま再生できます。</small></header><main><iframe name="effect" title="選択したマナ受領E"></iframe><aside><div id="buttons"></div><p id="detail"></p></aside></main>
<script type="module">
const index=await(await fetch('./versions.json')).json();const query=new URLSearchParams(location.search);const frame=document.querySelector('iframe'),buttons=document.querySelector('#buttons'),detail=document.querySelector('#detail');
for(const v of index.entries){const b=document.createElement('button');b.dataset.version=v.revision;b.textContent=`${v.revision} · ${v.quality==='failed'?'品質不採用':'品質審査中'}`;b.style.display='block';b.style.width='100%';b.style.marginBottom='8px';b.onclick=()=>{for(const x of buttons.children)x.setAttribute('aria-pressed',String(x===b));frame.src=v.entry+'?embed=1'+(query.has('verify')?'&verify=1':'');detail.textContent=v.qualityReason;document.body.dataset.selectedVersion=v.revision;};buttons.append(b);if(v.revision===index.current)b.click();}
</script></html>
