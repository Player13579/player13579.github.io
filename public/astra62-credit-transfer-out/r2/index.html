<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>クレジット譲渡成立・送り手側 R2</title><style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#14242e;color:#ecf2ef}
body{max-width:760px;margin:auto;padding:24px}h1{font-size:1.5rem}p{max-width:44rem}
canvas{display:block;width:100%;height:clamp(180px,35vh,285px);box-sizing:border-box;background:#162a35;border:1px solid #42595d;border-radius:8px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;padding:.35rem .65rem}

</style><main><h1>クレジット譲渡成立・送り手側 <small>R2</small></h1>
<p>クレジットの譲渡が成立すると、送り手の台帳に通貨記号と外向きの矢印が一度だけ刻まれます。</p>
<canvas aria-label="送り手の台帳に送金印を押す型"></canvas>
<div class="controls"><label>通知条件<select id="fixture"><option value="sent">本人のクレジット譲渡成立</option><option value="item">所持アイテムの譲渡</option><option value="incoming">クレジットの受領</option><option value="donation">募金</option><option value="failed">送金失敗</option><option value="foreign">他人の譲渡</option><option value="stale">古い通知</option></select></label>
<button id="play" disabled>送金印を再生</button><button id="stop" disabled>停止</button><label><input id="reduced" type="checkbox">動きを抑える</label><label><input id="sound" type="checkbox">音声</label></div>
<output id="state" role="status">WebGPUを準備中…</output><details><summary>描画情報</summary><pre id="receipt"></pre></details></main>
