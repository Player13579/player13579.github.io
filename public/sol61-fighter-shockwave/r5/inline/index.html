<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ファイターの剣衝撃波 R5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10212a;color:#e3edf0;font:14px system-ui}
main{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}canvas{width:100%;height:100%;display:block}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:.55em;padding:.48em .65em}button{font:inherit;background:#263943;color:inherit;border:1px solid #647e85;padding:.32em .65em;border-radius:.35em}button[aria-pressed=true]{border-color:#a4e4da}output{font-size:.85em}
nav{visibility:hidden}</style><main><canvas aria-label="剣先から衝撃波が放たれるプレビュー"></canvas><nav aria-label="再生設定">
<button id="normal" aria-pressed="true">通常</button><button id="giant" aria-pressed="false">特大</button>
<button id="light" aria-pressed="false">明背景</button><button id="audio">音声を開始</button><output role="status" id="status"></output>
</nav></main><script type="module" src="./adapter.mjs"></script></html>
