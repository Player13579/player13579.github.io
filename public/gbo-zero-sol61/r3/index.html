<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GBO 過駆動 R3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101720;color:#d0e4ed;font:14px sans-serif}
    #preview{display:block;width:100%;height:100%;border:0;background:#101720}
    html:not(.embed) #preview{height:calc(100% - 36px)}
    #status{height:36px;box-sizing:border-box;padding:9px 12px}
    html.embed #status{display:none}
  </style>
  <script src="./gallery-startup-bootstrap.js"></script>
</head>
<body>
  <iframe id="preview" title="GBO R3 WebGPU preview" allow="autoplay"></iframe>
  <div id="status" role="status">準備中</div>
  <script type="module" src="./gallery-host-r3.mjs"></script>
  <script type="module" src="./gallery-startup-adapter.mjs"></script>
</body>
</html>
