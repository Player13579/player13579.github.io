<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Teleport · Sol r1 WebGPU preview</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #0b1019; color: #e7effb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(920px, 100%); }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin: 0 0 12px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
    #status { color: #9eb4d4; font-size: 12px; }
    .stage { width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid #253449; border-radius: 10px; background: #0c1421; box-shadow: 0 20px 60px #0008; }
    canvas { width: 100%; height: 100%; display: block; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 12px; color: #9eb4d4; font-size: 12px; }
    button { border: 1px solid #46617c; border-radius: 6px; background: #142438; color: #eff7ff; padding: 8px 12px; cursor: pointer; }
    button:disabled { cursor: default; opacity: .75; }
    .note { max-width: 68ch; }
    details { margin-top: 10px; color: #9eb4d4; font: 11px/1.4 ui-monospace, monospace; }
    pre { max-height: 180px; overflow: auto; white-space: pre-wrap; color: #bfd3eb; }
    @media (max-width: 600px) { body { padding: 14px; } footer { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Teleport · GPT-6.1-Sol r1</h1><span id="status">WebGPUを初期化しています</span></header>
    <div class="stage"><canvas id="teleport" aria-label="WebGPU teleport effect preview"></canvas></div>
    <footer>
      <span class="note">760 E-ms cycle · H64 reference · Gallery body placeholder · body/map receiving disabled</span>
      <button id="sound" type="button">クリックして音声を有効化</button>
    </footer>
    <details><summary>Runtime diagnostics</summary><pre id="diagnostics">Starting</pre></details>
  </main>
  <script type="module">
    import { startTeleportGallery } from './runtime.mjs';
    const status = document.querySelector('#status');
    const diagnostics = document.querySelector('#diagnostics');
    try {
      await startTeleportGallery({ canvas: document.querySelector('#teleport'), soundButton: document.querySelector('#sound'), reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches });
      const diagnostic = window.__dvaTeleport;
      const update = () => {
        if (!diagnostic) return;
        status.textContent = diagnostic.state === 'running'
          ? `${diagnostic.current?.variant || '…'} · ${diagnostic.current?.ageEms?.toFixed(0) || 0} E-ms · frame ${diagnostic.frame} · ${diagnostic.shaderCompilation}`
          : `${diagnostic.state} · ${diagnostic.errors.map((e) => e.message).join('; ')}`;
        diagnostics.textContent = JSON.stringify({ sourceRevision: diagnostic.sourceRevision, frame: diagnostic.frame, state: diagnostic.state, shaderCompilation: diagnostic.shaderCompilation, audio: diagnostic.audio, current: diagnostic.current, errors: diagnostic.errors }, null, 2);
        requestAnimationFrame(update);
      };
      update();
    } catch (error) {
      window.__dvaTeleport ||= { state: 'error', errors: [], sourceRevision: 'sol61-action-teleport-zero-r1' };
      window.__dvaTeleport.errors.push({ where: 'page-start', message: String(error?.message || error) });
      diagnostics.textContent = JSON.stringify({ sourceRevision: window.__dvaTeleport.sourceRevision, frame: 0, errors: window.__dvaTeleport.errors }, null, 2);
      status.textContent = `WebGPU unavailable · ${error.message}`;
    }
  </script>
</body>
</html>
