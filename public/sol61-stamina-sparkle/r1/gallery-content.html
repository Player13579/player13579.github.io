<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Stamina Sparkle WebGPU Gallery Preview</title>
  <style>
    :root,html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#121b25; }
    body { position:relative; }
    #surface { display:block; width:100%; height:100%; border:0; }
    #error { position:fixed; inset:0 auto auto 0; z-index:2; max-width:100%; box-sizing:border-box; margin:0; padding:10px 12px; background:#351a20; color:#fff0f0; font:14px/1.45 system-ui,sans-serif; white-space:pre-wrap; overflow-wrap:anywhere; }
    #sound { position:fixed; left:-10000px; top:0; width:1px; height:1px; overflow:hidden; }
  </style>
</head>
<body>
  <canvas id="surface" aria-label="スタミナ恩恵 WebGPU プレビュー"></canvas>
  <div id="error" role="alert" hidden></div>
  <button id="sound" type="button" tabindex="-1" aria-hidden="true" aria-label="ギャラリー操作で効果音を有効にする"></button>
  <script>
    (() => {
      const reveal = value => {
        const pane = document.getElementById('error');
        if (!pane) return;
        const message = value instanceof Error ? (value.stack || value.message) : String(value);
        pane.textContent = `preview load/runtime failure: ${message}`;
        pane.hidden = false;
        document.body.dataset.failed = 'true';
      };
      window.addEventListener('error', event => reveal(event.message || event.target?.src || event.target?.href || 'module or runtime error'), true);
      document.addEventListener('error', event => {
        if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement) reveal(`resource failed: ${event.target.src || event.target.href}`);
      }, true);
      window.addEventListener('unhandledrejection', event => reveal(event.reason));
      window.__dvaStaminaGalleryError = reveal;
    })();
  </script>
  <script type="module" src="./gallery-adapter.mjs"></script>
</body>
</html>
