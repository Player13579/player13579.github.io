<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>action-item-pickup | sol-r2</title>
<style>
  :root{color-scheme:dark;font:14px system-ui,sans-serif}body{margin:0;padding:16px;background:#101722;color:#e6eef2}h1{font-size:16px;margin:0 0 10px}.row{display:flex;flex-wrap:wrap;gap:12px}.panel{display:grid;gap:4px}canvas{display:block;width:256px;height:160px;image-rendering:auto}.caption{font-size:12px}aside{margin-top:10px;max-width:540px}button{font:inherit;margin-right:8px}pre{font-size:11px;white-space:pre-wrap}body.embed,body.single{padding:0;background:transparent}body.embed h1,body.embed aside,body.embed .caption,body.single .caption{display:none}body.embed .row{gap:0}body.single .panel:not(.chosen){display:none}
</style></head><body><h1>接地アイテム取得 / action-item-pickup / sol-r2</h1><div class="row"><div class="panel"><canvas id="dark" width="256" height="160"></canvas><div class="caption">暗色 / H64</div></div><div class="panel"><canvas id="light" width="256" height="160"></canvas><div class="caption">明色 / H64</div></div></div><aside><button id="sound">SFXを再生</button><button id="pause">一時停止</button><pre id="status"></pre></aside>
<script type="module">
import {createItemPickupEffect,DURATION_MS,playItemPickupSfx} from './item-pickup-e.js';
const query=new URLSearchParams(location.search);if(query.has('embed'))document.body.classList.add('embed');if(query.has('single')||query.has('embed'))document.body.classList.add('single');
const status=document.getElementById('status');const errors=[];window.addEventListener('error',e=>errors.push(String(e.message||e.error)));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const adapter=await navigator.gpu?.requestAdapter();if(!adapter)throw new Error('WebGPU adapter unavailable');const device=await adapter.requestDevice();device.addEventListener('uncapturederror',e=>errors.push(String(e.error?.message||e.error)));
const chosenCanvas=document.getElementById(query.has('light')?'light':'dark');if(document.body.classList.contains('single'))chosenCanvas.parentElement.classList.add('chosen');
const canvasList=document.body.classList.contains('single')?[chosenCanvas]:[...document.querySelectorAll('canvas')];
const surfaces=canvasList.map(canvas=>{const context=canvas.getContext('webgpu');if(!context)throw new Error('WebGPU context unavailable');const format=navigator.gpu.getPreferredCanvasFormat();context.configure({device,format,alphaMode:'opaque'});return {canvas,context,effect:createItemPickupEffect(device,format),light:canvas.id==='light'};});
const cycle=DURATION_MS+550;const fixedAt=query.has('at')?Math.max(0,Math.min(DURATION_MS+1,Number(query.get('at')))):null;let first=performance.now(),last=first,frames=0,maxGap=0,paused=false,hold=0,loops=0;const recentGaps=[];let audioUnlocked=false,soundLastLoop=-1,sfxLoops=0;
async function enableItemPickupLoopAudio(){if(query.has('verify'))return false;const ctx=window.audioContext||(window.audioContext=new AudioContext());await ctx.resume();audioUnlocked=ctx.state==='running';soundLastLoop=loops;document.getElementById('sound').textContent=audioUnlocked?'SFXループ中':'SFXを有効化';return audioUnlocked;}
window.enableItemPickupLoopAudio=enableItemPickupLoopAudio;
function frame(now){const gap=now-last;last=now;if(frames){maxGap=Math.max(maxGap,gap);recentGaps.push(gap);if(recentGaps.length>120)recentGaps.shift();}frames++;const ms=fixedAt??(paused?hold:(now-first)%cycle);loops=Math.floor((now-first)/cycle);if(audioUnlocked&&!paused&&fixedAt===null&&loops!==soundLastLoop){soundLastLoop=loops;if(playItemPickupSfx({eventId:'preview-loop-'+loops,audioContext:window.audioContext}))sfxLoops++;}for(const surface of surfaces){const encoder=device.createCommandEncoder();const view=surface.context.getCurrentTexture().createView();const pass=encoder.beginRenderPass({colorAttachments:[{view,loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});if(!query.has('benchmark'))surface.effect.draw(pass,{elapsedMs:ms,width:256,height:160,centerX:128,centerY:78,scale:1,preview:true,light:surface.light,reducedMotion:query.has('reduced')});pass.end();device.queue.submit([encoder.finish()]);}
const sorted=[...recentGaps].sort((a,b)=>a-b);window.itemPickupDiagnostics={frames,maxGap,recentMedianGapMs:sorted[Math.floor(sorted.length*0.5)]??0,recentP95GapMs:sorted[Math.floor(sorted.length*0.95)]??0,loops,sfxLoops,audioUnlocked,reducedMotion:query.has('reduced'),phase:Math.min(ms/DURATION_MS,1),elapsedMs:ms,gpuErrors:errors.slice(),verify:query.has('verify'),audioGain:query.has('verify')?0:0.26,webgpu:true,visibility:document.visibilityState};if(frames%15===0)status.textContent=JSON.stringify(window.itemPickupDiagnostics,null,2);requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.getElementById('pause').onclick=()=>{paused=!paused;if(!paused)first=performance.now()-hold;else hold=(performance.now()-first)%cycle;document.getElementById('pause').textContent=paused?'再開':'一時停止';};
document.getElementById('sound').onclick=enableItemPickupLoopAudio;
for(const canvas of document.querySelectorAll('canvas'))canvas.addEventListener('pointerdown',enableItemPickupLoopAudio);
window.addEventListener('pagehide',()=>{for(const s of surfaces)s.effect.dispose();device.destroy();window.audioContext?.close();});
</script></body></html>
