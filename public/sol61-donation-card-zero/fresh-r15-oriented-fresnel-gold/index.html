<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>募金 R15 指向性フレネル金 · 追加改善 3/5</title>
<style>body{background:#111820;color:#eef2f5;font:14px system-ui;margin:16px}canvas{display:block;width:min(100%,960px);aspect-ratio:3/2}button,input{font:inherit}fieldset{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}label{display:flex;gap:5px}body.embedded{margin:0;width:100%;height:100dvh;overflow:hidden}body.embedded h1,body.embedded fieldset{display:none}body.embedded canvas{width:100%;height:100%;aspect-ratio:auto}body.embedded #status{position:fixed;left:8px;bottom:8px;max-width:min(92vw,560px);margin:0;padding:4px 8px;border-radius:4px;background:#111820cc;color:#dbe7f0;font-size:12px;pointer-events:none}body.embedded #status:not([data-state="error"]){display:none}body.embedded #status[data-state="error"]{display:block;color:#ffd1c9;border:1px solid #b74c3d}</style>
<h1>募金 R15 指向性フレネル金 · 追加改善 3/5</h1><canvas id="effect" width="960" height="640"></canvas><fieldset><button id="start">再生</button><label>時刻ms <input id="age" type="number" value="1100" min="0" max="2500" step="10"></label><button id="hold">固定</button><button id="clear">終了</button><label><input id="main" type="checkbox" checked>作用</label><label><input id="source" type="checkbox" checked>発光源</label><label><input id="rays" type="checkbox" checked>光条</label><label><input id="near" type="checkbox" checked>近傍光</label></fieldset>
<fieldset><label>視点yaw° <input id="yaw" type="range" min="-75" max="75" value="0"></label><label>視点pitch° <input id="pitch" type="range" min="-60" max="60" value="0"></label><label>粗さ <input id="roughness" type="range" min=".14" max=".8" step=".01" value=".24"></label><label>照明 <input id="light" type="range" min="0" max="4" step=".05" value="1.3"></label></fieldset><p id="status">WebGPU準備中</p><script type="module" src="./app.mjs"></script></html>
