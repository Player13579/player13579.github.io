<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>募金E — クレジットカード決済 r3 OBS</title>
<style>body{margin:0;background:#121c26;color:#e8f4ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}h1{font-size:20px}p{line-height:1.6}button,select,input{font:inherit}button,select{padding:7px;margin:4px;background:#263c4c;color:#fff;border:1px solid #708ca0;border-radius:5px}.large{width: min(960px,100%);aspect-ratio:2;display:block;background:#283841}#native{width:320px;height:160px;display:block;background:#283841}label{margin-right:15px}#status{white-space:pre-wrap}canvas{border:1px solid #576a77}output{font-variant-numeric:tabular-nums}</style>
<style>body.embed{padding:0;background:transparent;overflow:hidden;height:100vh;display:grid;place-items:center}body.embed main{margin:0;max-width:none}body.embed main>*{display:none}body.embed #native{display:none}body.embed #large{display:block;width:min(100vw,200vh);height:auto;aspect-ratio:2;border:0;background:transparent}body.embed.failed #status{display:block;color:#ffb4b4;padding:12px;background:#1f1111}</style>
<main><h1>募金E — カードを読み取り、決済成立後に金貨を送る</h1>
<p>GPT-6.1-Sol カード決済改稿 r3 OBS / 未採用・実GPU未確認・品質未受入。これは架空のギャラリーfixtureです。実決済・通信は行いません。金貨3枚は金額を表す枚数ではなく移動の象徴です。</p>
<canvas id="large" class="large" aria-label="拡大検査"></canvas><p>実寸検査：金貨高さ14px、カード高さ25px、現象支持高さ64px（倍率1）</p><canvas id="native" aria-label="実寸検査"></canvas>
<p><button id="play" disabled>模擬成功レシートを再生</button><button id="stop" disabled>停止</button><select id="phase" disabled><option value="-1">停止</option><option value="260">カード提示</option><option value="730">カード読取</option><option value="960">決済成立</option><option value="1460">金貨移動</option><option value="1830">金貨到着</option><option value="2410">受領・収束</option><option value="2800">寿命終了</option></select></p>
<p><label><input type="checkbox" id="source" checked>主現象 ON</label><label><input type="checkbox" id="obs" checked>観測光 ON</label><label>観測強度 <input type="range" id="intensity" min="0" max="2" step="0.05" value="1"></label><output id="intensityValue">1.00</output><label>時刻 <input type="range" id="time" min="0" max="2800" value="0"></label><output id="ms">0 ms</output></p>
<p id="audio"></p><p id="status">初期化中</p></main><script src="./startup-bootstrap.js"></script><script type="module" src="./preview.mjs"></script></html>
