<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rational Free · GPT-6.1-Sol r1</title>
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;background:#0b1118;color:#e5edf2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#0b1118}
main{width:min(100%,980px)}header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 0 10px}h1{font-size:16px;margin:0}#status{font-size:12px;color:#9eb3c1}
canvas{display:block;width:100%;height:auto;aspect-ratio:980/620;background:#101820;border:1px solid #344451}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 0;color:#bccbd3;font-size:12px}
button{border:1px solid #56707f;border-radius:4px;background:#1a2b37;color:#e7f2f6;padding:6px 10px;cursor:pointer}
label{display:inline-flex;align-items:center;gap:5px}body.embedded{padding:0;min-height:auto;display:block}body.embedded main{width:100%;max-width:980px}body.embedded header,body.embedded .controls{display:none}body.embedded canvas{border:0}
</style>
</head>
<body>
<main>
<header><h1>Rational free · one successful cost waiver</h1><span id="status">Starting WebGPU…</span></header>
<canvas id="stage" width="980" height="620" aria-label="WebGPU effect preview"></canvas>
<div class="controls" aria-label="Independent preview controls">
  <button id="sound" type="button" disabled>Enable sound after first GPU frame</button>
  <button id="background" type="button">Background: dark</button>
  <button id="receive" type="button">New waiver receipt</button>
  <label><input id="main" type="checkbox" checked> main</label>
  <label><input id="receiveLayer" type="checkbox" checked> receive</label>
  <label><input id="source" type="checkbox" checked> source visible</label>
  <label><input id="stars" type="checkbox" checked> stars</label>
  <label><input id="post" type="checkbox" checked> OBS</label>
  <label><input id="back" type="checkbox" checked> back</label>
  <label><input id="front" type="checkbox" checked> front</label>
</div>
</main>
<script type="module" src="./runtime.mjs?v=sol61-rational-free-r1-runtime-17"></script>
