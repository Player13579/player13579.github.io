<circle id="A-16" cx="0.8" cy="0.68" r="0.035" fill="#294F53"/>
</g>
<text x="300.0" y="612" class="small" text-anchor="middle">各行の変位：0 / 0 / 0 / 0</text>
<text x="300.0" y="642" class="body" text-anchor="middle">最短中心間距離：0.12</text>
<text x="300.0" y="670" class="small" text-anchor="middle">左右余白：各0.165　全体幅：0.67</text>
<text x="850.0" y="132" class="head" text-anchor="middle">B  互い違い</text>
<text x="850.0" y="160" class="small" text-anchor="middle">隣接行の相対ずれ 0.10 = P/2</text>
<rect x="650" y="178" width="400" height="400" fill="#FFFEFA" stroke="#D0D5D1"/>
<g id="B" data-panel="B" transform="translate(650 178) scale(400)">
