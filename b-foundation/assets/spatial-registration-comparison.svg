<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="806" viewBox="0 0 1150 806" role="img" aria-labelledby="title desc">
<title id="title">反復列の相対位置ずれ：整列と互い違い</title>
<desc id="desc">同色16円の形、面積、行位置、行内周期と全体の平均中心を保ち、行ごとの水平変位だけを変える二案。最短中心間距離と余白は変化する。知覚群化や美的評価の測定ではない。</desc>
<metadata id="construction">{&quot;panels&quot;: [{&quot;id&quot;: &quot;A&quot;, &quot;x&quot;: 100, &quot;y&quot;: 178, &quot;scale&quot;: 400}, {&quot;id&quot;: &quot;B&quot;, &quot;x&quot;: 650, &quot;y&quot;: 178, &quot;scale&quot;: 400}], &quot;coordinate_system&quot;: &quot;screen [0,1]^2, x right, y down&quot;, &quot;radius&quot;: 0.035, &quot;color&quot;: &quot;#294F53&quot;, &quot;candidates&quot;: {&quot;A&quot;: {&quot;row_offsets&quot;: [0, 0, 0, 0], &quot;centers&quot;: [[0.2, 0.32], [0.4, 0.32], [0.6, 0.32], [0.8, 0.32], [0.2, 0.44], [0.4, 0.44], [0.6, 0.44], [0.8, 0.44], [0.2, 0.56], [0.4, 0.56], [0.6, 0.56], [0.8, 0.56], [0.2, 0.68], [0.4, 0.68], [0.6, 0.68], [0.8, 0.68]]}, &quot;B&quot;: {&quot;row_offsets&quot;: [-0.05, 0.05, -0.05, 0.05], &quot;centers&quot;: [[0.15, 0.32], [0.35, 0.32], [0.55, 0.32], [0.75, 0.32], [0.25, 0.44], [0.45, 0.44], [0.65, 0.44], [0.85, 0.44], [0.15, 0.56], [0.35, 0.56], [0.55, 0.56], [0.75, 0.56], [0.25, 0.68], [0.45, 0.68], [0.65, 0.68], [0.85, 0.68]]}}, &quot;meaning&quot;: &quot;Declared geometry, not measured perceptual grouping or B generated pixels&quot;, &quot;B_image_generation&quot;: &quot;not_run&quot;, &quot;perceptual_evaluation&quot;: &quot;not_run&quot;}</metadata>
<rect width="1150" height="806" fill="#F6F3EC"/>
<style>text{font-family:"Yu Gothic",Meiryo,sans-serif;fill:#252C32}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#4A545D}</style>
<text x="40" y="48" class="title" text-anchor="start">反復列の位置ずれから配置候補を作る</text>
<text x="40" y="82" class="body" text-anchor="start">形・色・16個の円・行位置・行内周期を固定。全体の平均中心も両案で (0.5, 0.5)。</text>
<text x="300.0" y="132" class="head" text-anchor="middle">A  整列</text>
<text x="300.0" y="160" class="small" text-anchor="middle">隣接行の相対ずれ 0</text>
<rect x="100" y="178" width="400" height="400" fill="#FFFEFA" stroke="#D0D5D1"/>
<g id="A" data-panel="A" transform="translate(100 178) scale(400)">
