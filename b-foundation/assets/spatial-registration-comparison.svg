<text x="850.0" y="612" class="small" text-anchor="middle">各行の変位：−0.05 / +0.05 / −0.05 / +0.05</text>
<text x="850.0" y="642" class="body" text-anchor="middle">最短中心間距離：√(0.10² + 0.12²) ≈ 0.1562</text>
<text x="850.0" y="670" class="small" text-anchor="middle">左右余白：各0.115　全体幅：0.77</text>
<path d="M40 702H1110" stroke="#C4C8C7"/>
<text x="40" y="734" class="small" text-anchor="start">半径 0.035、行内周期 P=0.20、行間隔 0.12。総占有面積は両案とも 0.0196π。</text>
<text x="40" y="760" class="small" text-anchor="start">近接距離・方向と余白の幾何が変わる。有限の端と同距離の近傍があり、群の読みや好みは未測定。</text>
<text x="40" y="786" class="small" text-anchor="start">図案内部の線や記号は追加していない。これは説明図であり、B画像・動画の生成結果ではない。</text>
</svg>
