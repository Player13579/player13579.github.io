<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="title desc">
  <title id="title">同じ空隙面積で、空隙の形を変える</title>
  <desc id="desc">幾何関係の説明図。二案とも200×160の領域内に20×100の紙片2枚を完全に収める。Aは長辺を平行に置き、Bは左をマイナス15度、右を15度回して下側が狭く上方へ開く抜けを作る。紙片同士は接触しない。両案の総占有面積は4000、総空隙面積は28000で等しい。B生成画像や美的効果の観察結果ではない。</desc>
  <rect width="860" height="430" fill="#ffffff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" fill="#202936">
    <text x="30" y="32" font-size="22" font-weight="700">同じ空隙面積で、空隙の形を変える</text>
    <text x="30" y="63" font-size="17">A　向き合う長辺が平行</text>
    <text x="455" y="63" font-size="17">B　上方へ広がる抜け</text>
    <g transform="translate(30 78) scale(1.85)">
      <rect width="200" height="160" fill="#fff2cd" stroke="#c7ad6b" stroke-width="0.6"/>
      <g fill="#8faec2" stroke="#28485e" stroke-width="0.8">
        <rect x="65" y="30" width="20" height="100"/>
        <rect x="115" y="30" width="20" height="100"/>
      </g>
    </g>
    <g transform="translate(455 78) scale(1.85)">
      <rect width="200" height="160" fill="#fff2cd" stroke="#c7ad6b" stroke-width="0.6"/>
      <g fill="#8faec2" stroke="#28485e" stroke-width="0.8">
        <rect x="65" y="30" width="20" height="100" transform="rotate(-15 75 80)"/>
        <rect x="115" y="30" width="20" height="100" transform="rotate(15 125 80)"/>
      </g>
    </g>
    <rect x="30" y="390" width="12" height="12" fill="#8faec2"/>
    <text x="49" y="401" font-size="14">紙片：合計 4,000</text>
    <rect x="228" y="390" width="12" height="12" fill="#fff2cd" stroke="#c7ad6b"/>
    <text x="247" y="401" font-size="14">空隙：合計 28,000（両案共通・任意単位）</text>
    <text x="30" y="421" font-size="12" fill="#53606c">幾何関係の説明図。形・枚数・支持平面・投影は固定。美的効果は未検証。</text>
  </g>
</svg>
