<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="title desc">
  <title id="title">同じ大小2円を、距離で構成する</title>
  <desc id="desc">面積比4対1を固定した大小2円の配置候補。Aの面積代理分布中心は0.46、Bは0.50、Cは0.54。AからBは小円だけを右へ移動し、CはAの全配置の左右反転。基準点は0.50。青の破線と橙の菱形は計算補助表示であり図案の要素ではない。重心の中央一致は知覚的均衡や美しさの保証ではない。</desc>
  <rect width="1200" height="690" fill="#ffffff"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" fill="#202936">
    <text x="30" y="40" font-size="27" font-weight="700">同じ大小2円を、距離で構成する</text>
    <text x="30" y="75" font-size="16">形・大きさ・塗色は固定。面積を代理重み4:1として、配置候補を作る説明図です。</text>
    <text x="30" y="116" font-size="19" font-weight="700">A　代理分布は左寄り</text>
    <g transform="translate(30 135) scale(0.34)" data-panel="A">
      <rect width="1000" height="1000" fill="#F3EFE5" data-background="true"/>
      <circle cx="425" cy="500" r="100" fill="#27333F" data-element-id="large"/>
      <circle cx="600" cy="500" r="50" fill="#27333F" data-element-id="small"/>
      <line x1="500" x2="500" y1="40" y2="960" stroke="#24718a" stroke-width="4" stroke-dasharray="16 14" data-guide="anchor"/>
      <path d="M 460.0 477 l 23 23 l -23 23 l -23 -23 Z" fill="#df8b35" stroke="#ffffff" stroke-width="3" data-guide="area-proxy-center"/>
    </g>
    <rect x="30" y="135" width="340" height="340" fill="none" stroke="#cbd2d9"/>
    <text x="30" y="508" font-size="17">c_x = 0.46 ／ m_x = -0.20</text>
    <text x="430" y="116" font-size="19" font-weight="700">B　代理分布は中央</text>
    <g transform="translate(430 135) scale(0.34)" data-panel="B">
      <rect width="1000" height="1000" fill="#F3EFE5" data-background="true"/>
      <circle cx="425" cy="500" r="100" fill="#27333F" data-element-id="large"/>
      <circle cx="800" cy="500" r="50" fill="#27333F" data-element-id="small"/>
      <line x1="500" x2="500" y1="40" y2="960" stroke="#24718a" stroke-width="4" stroke-dasharray="16 14" data-guide="anchor"/>
      <path d="M 500.0 477 l 23 23 l -23 23 l -23 -23 Z" fill="#df8b35" stroke="#ffffff" stroke-width="3" data-guide="area-proxy-center"/>
    </g>
    <rect x="430" y="135" width="340" height="340" fill="none" stroke="#cbd2d9"/>
    <text x="430" y="508" font-size="17">c_x = 0.50 ／ m_x = +0.00</text>
    <text x="830" y="116" font-size="19" font-weight="700">C　Aを左右反転</text>
    <g transform="translate(830 135) scale(0.34)" data-panel="C">
      <rect width="1000" height="1000" fill="#F3EFE5" data-background="true"/>
      <circle cx="575" cy="500" r="100" fill="#27333F" data-element-id="large"/>
      <circle cx="400" cy="500" r="50" fill="#27333F" data-element-id="small"/>
      <line x1="500" x2="500" y1="40" y2="960" stroke="#24718a" stroke-width="4" stroke-dasharray="16 14" data-guide="anchor"/>
      <path d="M 540.0 477 l 23 23 l -23 23 l -23 -23 Z" fill="#df8b35" stroke="#ffffff" stroke-width="3" data-guide="area-proxy-center"/>
    </g>
    <rect x="830" y="135" width="340" height="340" fill="none" stroke="#cbd2d9"/>
    <text x="830" y="508" font-size="17">c_x = 0.54 ／ m_x = +0.20</text>
    <text x="30" y="548" font-size="16">A→B：小円のxだけを0.60から0.80へ。C：Aの全配置を反転し、偏りの向きも反転。</text>
    <line x1="30" x2="65" y1="580" y2="580" stroke="#24718a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="75" y="585" font-size="15">基準線 b_x=0.50</text>
    <path d="M 365 570 l 10 10 l -10 10 l -10 -10 Z" fill="#df8b35"/>
    <text x="385" y="585" font-size="15">面積代理分布中心 c（補助表示）</text>
    <text x="30" y="620" font-size="15">c=Σ(w_i p_i)/Σw_i、m=Σw_i(p_i−b)。mは相対重み×画面座標で、力学的トルクではありません。</text>
    <text x="30" y="650" font-size="15">計算上の中央一致、知覚的な均衡、美的選好は別の判断です。B画像の生成・知覚評価は未実施。</text>
    <text x="30" y="676" font-size="14">位置変更に伴い、間隔と余白も変わります。青の破線と橙の菱形は計算補助で、図案へ追加する要素ではありません。</text>
  </g>
  <metadata id="placement-data">{"domain":[0,1000,0,1000],"anchor":[500,500],"weight_definition":"normalized area proxy, large4:small1; not perceptual measurement or physical mass","cases":[{"id":"A","centers":{"large":[425,500],"small":[600,500]},"radii":{"large":100,"small":50},"weights":{"large":4,"small":1},"center":[460.0,500],"normalized_moment":[-0.2,0]},{"id":"B","centers":{"large":[425,500],"small":[800,500]},"radii":{"large":100,"small":50},"weights":{"large":4,"small":1},"center":[500.0,500],"normalized_moment":[0.0,0]},{"id":"C","centers":{"large":[575,500],"small":[400,500]},"radii":{"large":100,"small":50},"weights":{"large":4,"small":1},"center":[540.0,500],"normalized_moment":[0.2,0]}],"scope":"educational geometry; no B image, measured balance or beauty"}</metadata>
</svg>
