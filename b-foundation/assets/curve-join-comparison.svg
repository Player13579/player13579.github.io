<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">輪郭のつながりと角を描き分ける</title>
<desc id="desc">既存の三次ベジェ曲線2本で右側の制御点Q1だけを変える。Aは位置のみ、Bは接線方向、Cは接線と曲率がつながる。角を残す意図も保持し、美しさの順位を示さない。上は全体、下は同じ倍率の接合拡大。</desc>
<metadata id="construction">{&quot;source&quot;: {&quot;status&quot;: &quot;locked planar geometric construction; numerical values independently verified; no B generation&quot;, &quot;subject&quot;: &quot;Construct optional join continuity between two already-declared planar cubic Bezier pieces&quot;, &quot;coordinates&quot;: &quot;Mathematical x right, y up; arbitrary consistent display units; not physical/world curvature or time&quot;, &quot;left_control_points&quot;: [[-1, 0.3], [-0.7, 0.4], [-0.2, 0], [0, 0]], &quot;right_fixed&quot;: {&quot;Q0&quot;: [0, 0], &quot;Q2&quot;: [0.7, 0.4], &quot;Q3&quot;: [1, 0.3]}, &quot;right_Q1_candidates&quot;: {&quot;A_G0_only&quot;: [0.2, 0.15], &quot;B_G1_not_G2&quot;: [0.4, 0], &quot;C_G2_not_C2&quot;: [0.2, 0]}, &quot;derivatives_at_join&quot;: {&quot;left_velocity&quot;: [0.6, 0], &quot;left_second&quot;: [-1.8, 2.4], &quot;right_A_velocity&quot;: [0.6, 0.45], &quot;right_A_second&quot;: [1.8, 0.6], &quot;right_B_velocity&quot;: [1.2, 0], &quot;right_B_second&quot;: [-0.6, 2.4], &quot;right_C_velocity&quot;: [0.6, 0], &quot;right_C_second&quot;: [1.8, 2.4]}, &quot;expected_signed_curvatures&quot;: {&quot;formula&quot;: &quot;kappa=det(r_prime,r_second)/norm(r_prime)^3&quot;, &quot;left&quot;: &quot;20/3&quot;, &quot;right_A&quot;: &quot;-16/15&quot;, &quot;right_B&quot;: &quot;5/3&quot;, &quot;right_C&quot;: &quot;20/3&quot;}, &quot;preserved&quot;: [&quot;piece count&quot;, &quot;shared join point&quot;, &quot;outer endpoints&quot;, &quot;outer tangent directions and derivative vectors&quot;, &quot;left piece control points&quot;, &quot;rightQ2/Q3&quot;, &quot;positive x derivative/regular curves (to verify)&quot;], &quot;selected_free_attribute&quot;: &quot;RightQ1 inside declared unassigned shape freedom only; all world contact/support/declared geometric restrictions still apply&quot;, &quot;scientific_boundary&quot;: &quot;Geometric construction, not a claim that G2 is universally more beautiful. Intended sharp corners may be chosen. G1/G2 and parameter C1/C2 must be distinguished. No temporal smoothness inference.&quot;, &quot;definitions&quot;: {&quot;G0&quot;: &quot;shared join position&quot;, &quot;G1&quot;: &quot;shared oriented unit tangent for regular curves&quot;, &quot;G2&quot;: &quot;G1 plus common curvature vector; oriented planar example uses common signed curvature&quot;, &quot;C1_C2&quot;: &quot;matching derivatives of order1 / orders1and2 in declared curve parameterization; not required verbatim by G1/G2&quot;, &quot;sources&quot;: [&quot;https://mcneel.github.io/rhinocommon-api-docs/api/RhinoCommon/html/T_Rhino_Geometry_Continuity.htm&quot;, &quot;https://www.occt3d.com/dev/doc/overview/html/occt_user_guides__modeling_data.html&quot;], &quot;source_scope&quot;: &quot;Official enum and Modeling Data section Continuity of Curves and Surfaces, not full API manual&quot;}, &quot;geometry_limits&quot;: &quot;All3curves differ away from join too. Outer endpoints/tangents and left piece fixed; total arc length/ink area/bounding shape not held equal. Aesthetic effect unobserved.&quot;}, &quot;global&quot;: {&quot;baseline_y&quot;: 330, &quot;scale&quot;: [145, -145]}, &quot;zoom&quot;: {&quot;baseline_y&quot;: 620, &quot;scale&quot;: [600, -600]}, &quot;centers_x&quot;: [205, 600, 995], &quot;canvas&quot;: [1200, 960], &quot;scope&quot;: &quot;native educational SVG; not B image generation or perceptual validation&quot;}</metadata>
<style>
text{font-family:"Yu Gothic","Meiryo",sans-serif;fill:#19363c} .heading{font-size:30px;font-weight:700}
.sub{font-size:17px} .coltitle{font-size:22px;font-weight:700} .label{font-size:18px}
.small{font-size:16px} .note{font-size:18px} .muted{fill:#526b70}
</style>
<rect width="1200" height="960" fill="#f5f8f6"/>
<text x="40" y="53" class="heading">輪郭のつながりと角を描き分ける</text>
<text x="40" y="83" class="sub">同じ接合点・外側の端点と接線を保ち、右側の制御点 Q1 だけを変える</text>
<defs><clipPath id="global-clip-0" clipPathUnits="userSpaceOnUse"><rect x="40" y="190" width="330" height="185"/></clipPath>
<clipPath id="zoom-clip-0" clipPathUnits="userSpaceOnUse"><rect x="40" y="450" width="330" height="200"/></clipPath></defs>
<text x="40" y="126" class="coltitle">A　位置だけ一致</text>
<text x="40" y="155" class="label">G0 のみ</text>
<text x="40" y="181" class="small muted">全体と制御点</text>
<rect x="40" y="190" width="330" height="185" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#global-clip-0)"><g transform="translate(205,330) scale(145,-145)">
<polyline points="-1,0.3 -0.7,0.4 -0.2,0 0,0 0.2,0.15 0.7,0.4 1,0.3" fill="none" stroke="#adbbbc" stroke-width="0.009"/>
<path id="curve-0" data-candidate="A_G0_only" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.2,0.15 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.020689655172" stroke-linejoin="miter" stroke-linecap="butt"/>

<circle cx="-1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.2" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0.2" cy="0.15" r="0.027586206897" fill="#a45b12" stroke="#a45b12" stroke-width="0.008"/>
<circle cx="0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
</g></g>
<text x="243" y="299.25" class="small">Q1</text>
<text x="52" y="363" class="small muted">灰色の点・線は設計補助</text>
<text x="40" y="411" class="label">つなぎ目を同じ倍率で拡大</text>
<rect x="40" y="450" width="330" height="200" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#zoom-clip-0)">
<path d="M 50 620 H 360 M 205 460 V 640" fill="none" stroke="#dde5e3" stroke-width="1"/>
<g transform="translate(205,620) scale(600,-600)"><path id="zoom-0" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.2,0.15 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.005" stroke-linejoin="miter" stroke-linecap="butt"/></g></g>
<text x="40" y="685" class="label">κ左 = 20/3　κ右 = −16/15</text>
<text x="40" y="715" class="small">Q1 = (0.2, 0.15)</text>
<text x="40" y="752" class="label">つなぎ目に角が残る</text>
<text x="40" y="781" class="small">接線方向も曲率も異なる</text>
<defs><clipPath id="global-clip-1" clipPathUnits="userSpaceOnUse"><rect x="435" y="190" width="330" height="185"/></clipPath>
<clipPath id="zoom-clip-1" clipPathUnits="userSpaceOnUse"><rect x="435" y="450" width="330" height="200"/></clipPath></defs>
<text x="435" y="126" class="coltitle">B　接線方向も一致</text>
<text x="435" y="155" class="label">G1（C1 ではない）</text>
<text x="435" y="181" class="small muted">全体と制御点</text>
<rect x="435" y="190" width="330" height="185" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#global-clip-1)"><g transform="translate(600,330) scale(145,-145)">
<polyline points="-1,0.3 -0.7,0.4 -0.2,0 0,0 0.4,0 0.7,0.4 1,0.3" fill="none" stroke="#adbbbc" stroke-width="0.009"/>
<path id="curve-1" data-candidate="B_G1_not_G2" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.4,0 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.020689655172" stroke-linejoin="miter" stroke-linecap="butt"/>

<circle cx="-1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.2" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0.4" cy="0" r="0.027586206897" fill="#a45b12" stroke="#a45b12" stroke-width="0.008"/>
<circle cx="0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
</g></g>
<text x="667" y="321" class="small">Q1</text>
<text x="447" y="363" class="small muted">灰色の点・線は設計補助</text>
<text x="435" y="411" class="label">つなぎ目を同じ倍率で拡大</text>
<rect x="435" y="450" width="330" height="200" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#zoom-clip-1)">
<path d="M 445 620 H 755 M 600 460 V 640" fill="none" stroke="#dde5e3" stroke-width="1"/>
<g transform="translate(600,620) scale(600,-600)"><path id="zoom-1" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.4,0 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.005" stroke-linejoin="miter" stroke-linecap="butt"/></g></g>
<text x="435" y="685" class="label">κ左 = 20/3　κ右 = 5/3</text>
<text x="435" y="715" class="small">Q1 = (0.4, 0)</text>
<text x="435" y="752" class="label">接線方向はつながる</text>
<text x="435" y="781" class="small">曲がり方には差が残る</text>
<defs><clipPath id="global-clip-2" clipPathUnits="userSpaceOnUse"><rect x="830" y="190" width="330" height="185"/></clipPath>
<clipPath id="zoom-clip-2" clipPathUnits="userSpaceOnUse"><rect x="830" y="450" width="330" height="200"/></clipPath></defs>
<text x="830" y="126" class="coltitle">C　曲率まで一致</text>
<text x="830" y="155" class="label">G2・C1（C2 ではない）</text>
<text x="830" y="181" class="small muted">全体と制御点</text>
<rect x="830" y="190" width="330" height="185" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#global-clip-2)"><g transform="translate(995,330) scale(145,-145)">
<polyline points="-1,0.3 -0.7,0.4 -0.2,0 0,0 0.2,0 0.7,0.4 1,0.3" fill="none" stroke="#adbbbc" stroke-width="0.009"/>
<path id="curve-2" data-candidate="C_G2_not_C2" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.2,0 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.020689655172" stroke-linejoin="miter" stroke-linecap="butt"/>

<circle cx="-1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="-0.2" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0" cy="0" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="0.2" cy="0" r="0.027586206897" fill="#a45b12" stroke="#a45b12" stroke-width="0.008"/>
<circle cx="0.7" cy="0.4" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
<circle cx="1" cy="0.3" r="0.027586206897" fill="#ffffff" stroke="#6e878a" stroke-width="0.008"/>
</g></g>
<text x="1033" y="321" class="small">Q1</text>
<text x="842" y="363" class="small muted">灰色の点・線は設計補助</text>
<text x="830" y="411" class="label">つなぎ目を同じ倍率で拡大</text>
<rect x="830" y="450" width="330" height="200" rx="8" fill="#ffffff" stroke="#bdccca"/>
<g clip-path="url(#zoom-clip-2)">
<path d="M 840 620 H 1150 M 995 460 V 640" fill="none" stroke="#dde5e3" stroke-width="1"/>
<g transform="translate(995,620) scale(600,-600)"><path id="zoom-2" d="M -1,0.3 C -0.7,0.4 -0.2,0 0,0 C 0.2,0 0.7,0.4 1,0.3" fill="none" stroke="#086b70" stroke-width="0.005" stroke-linejoin="miter" stroke-linecap="butt"/></g></g>
<text x="830" y="685" class="label">κ左 = 20/3　κ右 = 20/3</text>
<text x="830" y="715" class="small">Q1 = (0.2, 0)</text>
<text x="830" y="752" class="label">接線方向と曲率がつながる</text>
<text x="830" y="781" class="small">二階微分の一致とは別の条件</text>
<path d="M 40 811 H 1160" stroke="#bdccca"/>
<text x="40" y="843" class="note">位置 → 接線方向 → 曲率の順に、つなぎ目で揃える条件を選べる。</text>
<text x="40" y="871" class="note">C の二階微分は左 (−1.8, 2.4)、右 (1.8, 2.4)。G2 でも C2 とは限らない。</text>
<text x="40" y="899" class="small">κ は右向き x・上向き y の符号付き曲率。曲線パラメータ u は時間ではない。弧長・描線面積は固定していない。</text>
<text x="40" y="927" class="small">角を残す意図も優先する。滑らかさや美しさの順位を示す図ではない。B画像・知覚・美的効果は未検証。</text>
</svg>
