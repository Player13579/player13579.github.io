<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
<title id="title">B-3画像生成コードで描画条件と作業記録を分ける</title>
<desc id="desc">必須の描画条件とschemaを画像生成コードに保ち、重複する運用説明や監査記録を別置きにする。全葉の意味点検、構造検査、純度確認、生成後の画素確認は別々の段階である。</desc>
<rect width="1180" height="720" fill="#F6F3EC"/>
<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#252C32">
  <text x="42" y="52" font-size="30" font-weight="700">描画条件と作業記録を混ぜない</text>
  <text x="42" y="86" font-size="17" fill="#4A545D">B-3画像生成コードの純度を守るための配置</text>
  <rect x="42" y="122" width="650" height="330" rx="18" fill="#FFFFFF" stroke="#2C6F78" stroke-width="3"/>
  <text x="72" y="164" font-size="23" font-weight="700" fill="#245E65">画像生成コードに残す</text>
  <text x="74" y="207" font-size="18">• ユーザーの主題・動作・視点・構図</text>
  <text x="74" y="244" font-size="18">• 正確なキーワード展開・形・角度・数</text>
  <text x="74" y="281" font-size="18">• PHの材質・作用とOBSの範囲・尺度</text>
  <text x="74" y="318" font-size="18">• 正規schemaと必要なGenerationContract欄</text>
  <line x1="74" y1="340" x2="658" y2="340" stroke="#D6DFDC"/>
  <text x="74" y="374" font-size="16" fill="#4A545D">必須欄は保つ。欄の存在だけで実行・観察済みとはしない。</text>
  <rect x="724" y="122" width="414" height="330" rx="18" fill="#FFFFFF" stroke="#B87836" stroke-width="3"/>
  <text x="754" y="164" font-size="22" font-weight="700" fill="#8B5825">別の監査記録へ置く</text>
  <text x="756" y="207" font-size="17">• 検証コマンドとログ</text>
  <text x="756" y="244" font-size="17">• 重複したUI・送信制約の説明</text>
  <text x="756" y="281" font-size="17">• commit / SHA / 担当分担</text>
  <text x="756" y="318" font-size="17">• 生成・未生成・未確認の作業記録</text>
  <line x1="756" y1="340" x2="1108" y2="340" stroke="#E6D9C8"/>
  <text x="756" y="368" font-size="15" fill="#4A545D">正規schemaが求めるstatus欄を保持。</text>
  <text x="756" y="391" font-size="15" fill="#4A545D">実行・観察の状態は正確に記録。</text>
  <text x="699" y="294" font-size="17" fill="#69747B" text-anchor="middle">分離</text>
  <text x="42" y="485" font-size="20" font-weight="700">確認する役割を分ける</text>
  <text x="42" y="508" font-size="14" fill="#4A545D">下の配置は確認項目の例。固定手順ではなく、依存関係に応じて進める。</text>
  <g>
    <rect x="42" y="530" width="250" height="104" rx="14" fill="#E3EFEC" stroke="#6D9B91"/>
    <text x="62" y="566" font-size="18" font-weight="700">全葉を読む</text>
    <text x="62" y="596" font-size="15">余計な主題・矛盾・</text>
    <text x="62" y="617" font-size="15">運用説明を探す</text>
    <rect x="326" y="530" width="250" height="104" rx="14" fill="#E5EBF2" stroke="#7E91A8"/>
    <text x="346" y="566" font-size="18" font-weight="700">構造を検査</text>
    <text x="346" y="596" font-size="15">必須欄・参照・型を</text>
    <text x="346" y="617" font-size="15">照合する</text>
    <rect x="610" y="530" width="250" height="104" rx="14" fill="#F1EAD9" stroke="#B69A5E"/>
    <text x="630" y="566" font-size="18" font-weight="700">意味と純度を照合</text>
    <text x="630" y="596" font-size="15">要求・物理条件・画像文が</text>
    <text x="630" y="617" font-size="15">一貫するか読む</text>
    <rect x="894" y="530" width="244" height="104" rx="14" fill="#F4E3E0" stroke="#B57C74"/>
    <text x="914" y="566" font-size="18" font-weight="700">画素を確認</text>
    <text x="914" y="596" font-size="15">生成結果で意図と</text>
    <text x="914" y="617" font-size="15">可読性を確かめる</text>
  </g>
  <text x="310" y="584" font-size="14" fill="#69747B" text-anchor="middle">役割例</text><text x="594" y="584" font-size="14" fill="#69747B" text-anchor="middle">役割例</text><text x="878" y="584" font-size="14" fill="#69747B" text-anchor="middle">役割例</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69747B"/></marker></defs>
  <text x="42" y="665" font-size="16" font-weight="700" fill="#8C4037">構造pass ≠ 純度pass ≠ 画像の受入</text>
  <text x="1138" y="665" font-size="14" text-anchor="end" fill="#5B656C">説明図：処理手順の概念図。生成画像ではありません。</text>
</g>
</svg>

