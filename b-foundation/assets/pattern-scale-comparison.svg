<title id="title">Same two-color palette: stripe period and vector display size</title>
<desc id="desc">Six construction cases hold encoded colors and 50:50 area fractions. Columns vary source periods 64, 16 and 8 pixels. Rows render the vector scene at 256 and 128 pixels. Optional viewing assumptions are not measurements of this viewer or a color-induction simulation.</desc>
