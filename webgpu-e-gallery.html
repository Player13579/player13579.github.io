<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1018">
<title>E ギャラリー · Defenders vs Attackers</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a1018;color:#edf3f5}
*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid #8de8e1;outline-offset:3px}
main{max-width:1260px;margin:auto;padding:clamp(16px,3vw,34px)}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.eyebrow{color:#73d9d3;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(27px,4vw,44px);letter-spacing:-.04em;margin:5px 0 6px}header p,.intro{color:#a9bbc6;line-height:1.5;margin:0}
.counter{white-space:nowrap;font-size:12px;color:#98adb8;background:#18232c;border:1px solid #2c3d48;border-radius:999px;padding:7px 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}.viewer,.catalog{background:#111b24;border:1px solid #30424c;border-radius:16px;overflow:hidden}
.viewer-head{padding:16px 18px;border-bottom:1px solid #2b3b45;display:flex;justify-content:space-between;gap:15px;align-items:start}.viewer-head h2{font-size:22px;margin:0 0 4px}.viewer-head p{font-size:13px;color:#aebfc8;margin:0;line-height:1.45}.badge{font-size:11px;color:#9df0e5;background:#173b40;border:1px solid #346b6e;border-radius:999px;padding:5px 9px;white-space:nowrap}
.stage{position:relative;aspect-ratio:980/620;background:radial-gradient(circle at 50% 55%,#273843,#101820 60%);overflow:hidden}.stage iframe{display:block;width:100%;height:100%;border:0}
.notice{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#eac7bb;background:#111a24;line-height:1.5}.notice[hidden]{display:none}
.viewer-foot{padding:13px 18px;border-top:1px solid #2b3b45;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.viewer-foot p{font-size:12px;color:#9db0ba;margin:0}.viewer-foot a{color:#96e6de;font-size:12px;text-decoration:none}.viewer-foot a:hover{text-decoration:underline}
.catalog h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#93aeb9;margin:0;padding:16px 16px 12px}.catalog-list{display:grid;gap:3px;padding:0 8px 8px}.item{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:#d9e5e9;padding:10px 11px;cursor:pointer}.item:hover{background:#1c2b34}.item[aria-current=true]{background:#17343a;border-color:#408c89}.item strong{display:block;font-size:14px;font-weight:650}.item span{display:block;color:#9fb3bd;font-size:11px;margin-top:3px;line-height:1.35}.intro{font-size:12px;margin-top:14px}
@media(max-width:820px){header{align-items:start}.layout{grid-template-columns:1fr}.catalog-list{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{aspect-ratio:980/670}}@media(max-width:480px){.counter{display:none}.catalog-list{grid-template-columns:1fr}.viewer-head{flex-wrap:wrap}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">Defenders vs Attackers · WebGPU</div><h1>E ギャラリー</h1><p>完成したAstra制作版3件を再生しています。</p></div><div class="counter" id="entry-counter" aria-live="polite">0 件</div></header>
<div class="layout"><section class="viewer" aria-label="選択したEのプレビュー"><div class="viewer-head"><div><h2 id="selected-title"></h2><p id="selected-description"></p></div><span class="badge" id="selected-status"></span></div>
<div class="stage" id="stage"><div class="notice" id="notice" role="status">WebGPU を確認しています…</div></div>
<div class="viewer-foot"><p id="selected-source"></p><a id="selected-link" target="_blank" rel="noopener">元のプレビューを見る ↗</a></div></section>
<aside class="catalog"><h2>表示中のE</h2><div class="catalog-list" id="catalog"></div></aside></div>
<p class="intro">各版を自動でループ再生します。品質状態と本編への採用状況は版ごとに表示します。</p>
</main>
<script src="webgpu-e-gallery.js?v=three-completed-astra-designs-20260927-v1"></script>
</body></html>
