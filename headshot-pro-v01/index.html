<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Headshot Contact E · Pro v1</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 980px; height: 620px; margin: 0; overflow: hidden; background: #14181f; }
    body { display: grid; place-items: center; color: #aeb5bd; font: 10px/1.3 system-ui, sans-serif; }
    main { width: 640px; }
    .columns { display: grid; grid-template-columns: repeat(5, 128px); width: 640px; margin-bottom: 4px; text-align: center; letter-spacing: .06em; }
    canvas { display: block; width: 640px; height: 256px; }
    footer { margin-top: 5px; color: #7f8b98; text-align: center; }
    #status { position: fixed; left: 8px; bottom: 6px; color: #e6a6a6; }
  </style>
</head>
<body>
  <main aria-label="Headshot Contact E Pro v1 automatic WebGPU comparison">
    <div class="columns" aria-hidden="true"><span>HANDGUN</span><span>SMG</span><span>ASSAULT</span><span>SNIPER</span><span>TASER</span></div>
    <canvas id="native" width="640" height="256" aria-label="Native H64 dark preview, HIP and AIM variants"></canvas>
    <footer>H64 · 1× · upper row HIP · lower row AIM</footer>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
