<body><main>
<h1>スタミナ回復 E</h1>
<p class="note">独立設計の実装プレビュー · WebGPU描画 · H64 / H100実寸切替 · 未受入候補</p>
<div class="stage"><canvas id="preview" aria-label="スタミナ回復エフェクトのWebGPUプレビュー"></canvas></div>

<label>身長 <select id="height"><option value="64">H64</option><option value="100" selected>H100</option></select></label>

</div><p id="status" role="status">WebGPUを初期化しています…</p>
