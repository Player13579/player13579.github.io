<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080c18">
  <script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23080c18'/%3E%3Cpath d='M4 2v12m8-12v12M4 3q4-2 8 0M4 13q4 2 8 0' fill='none' stroke='%23b9b2ec' stroke-width='1.5'/%3E%3C/svg%3E">
  <title>バリア E · Astraゼロ設計 WebGPU試作</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Segoe UI",sans-serif;background:#080c18;color:#e8eaff}
    *{box-sizing:border-box}body{margin:0}main{width:min(1040px,100%);margin:auto;padding:16px}
    h1{font-size:clamp(20px,3vw,28px);margin:0 0 4px}.note{font-size:12px;color:#aab4d0;margin:0 0 10px}
    .stage{width:980px;max-width:100%;aspect-ratio:980/620;border:1px solid #252d45;border-radius:8px;overflow:hidden;background:#080c18}
    canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px}
    label{display:flex;gap:6px;align-items:center}select,button{color:inherit;background:#151c2d;border:1px solid #39435e;border-radius:5px;padding:6px 9px}button{cursor:pointer}
    #status{font-size:12px;min-height:1.4em;color:#bac4de;margin:8px 0 0}#status[data-error="1"]{color:#ffaaa9}
    html.embed,html.embed body{width:100%;height:100%;overflow:hidden}
    html.embed main{width:100%;height:100%;margin:0;padding:0}
    html.embed h1,html.embed .note,html.embed .controls,html.embed #status{display:none!important}
    html.embed .stage{width:100vw;max-width:none;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
  </style>
</head>
<body><main>
  <h1>バリア E</h1>
  <p class="note">Astraゼロ設計からの独立WebGPU候補 · 未統合・品質受入前</p>
  <div class="stage"><canvas id="barrier" aria-label="人物の外側に重なる広い防護面がWebGPUで変形・解体する試作"></canvas></div>
  <div class="controls" id="controls">
    <label>局面 <select id="event"><option value="grant">成立・持続</option><option value="hit">耐久吸収</option><option value="break">耐久破壊</option><option value="bust">バスト解除</option></select></label>
    <label>表示高 <select id="height"><option value="64">H64</option><option value="100">H100</option></select></label>
    <label>DPR <select id="dpr"><option value="1">1</option><option value="2">2</option></select></label>
    <label>移動 <select id="reduced"><option value="0">通常</option><option value="1">reduced</option></select></label>
    <label>時間倍率 <select id="rate"><option value="1">通常</option><option value="2">ACC2固定</option></select></label>
    <label>耐久q <select id="q"><option value="1">1.00</option><option value="0.5">0.50</option><option value="0.05">0.05</option></select></label>
    <button id="restart" type="button">局面を再生</button><button id="sound" type="button">音を有効にする</button>
  </div>
  <p id="status" role="status">WebGPU初期化中…</p>
</main>
<script src="webgpu-frame-core.js?v=barrier-astra-zero-1"></script>
<script src="webgpu-primitives.js?v=barrier-astra-zero-1"></script>
<script src="webgpu-compositing.js?v=barrier-astra-zero-1"></script>
<script src="webgpu-renderer.js?v=barrier-astra-zero-1"></script>
<script src="webgpu-barrier-astra-zero-preview.js?v=barrier-astra-zero-1"></script>
</body></html>
