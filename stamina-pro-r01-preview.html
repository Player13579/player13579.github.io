<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPT Pro Stamina r0.1 — WebGPU preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10141c; }
    #stage { position: relative; width: 980px; height: 620px; overflow: hidden; background: #10141c; }
    #host { width: 100%; height: 100%; }
    #view { display: block; width: 100%; height: 100%; }
    #error { position: absolute; inset: 12px 12px auto; z-index: 1; padding: 10px 12px; color: #fff; background: #701f2bdd; font: 14px/1.45 system-ui, sans-serif; }
    #sound { position: absolute; top: 10px; right: 10px; z-index: 2; min-width: 38px; height: 32px; border: 1px solid #8493a8; border-radius: 6px; color: #f4f7fb; background: #18212dcc; font: 12px system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main id="stage" aria-label="GPT Pro Stamina r0.1 WebGPU preview">
    <div id="host"></div>
    <div id="error" role="alert" hidden></div>
    <button id="sound" type="button" aria-label="SFXを有効にする" title="クリックして音を有効にする" hidden>♪ OFF</button>
  </main>
  <script type="module">
    import { mountStaminaProGallery, STAMINA_PRO_GALLERY } from './webgpu-stamina-pro-gallery-v01.js';
    const stage = document.getElementById('stage');
    const host = document.getElementById('host');
    const error = document.getElementById('error');
    const sound = document.getElementById('sound');
    const parameters = new URLSearchParams(location.search);
    const verificationMode = parameters.has('verify');
    const embedMode = parameters.get('embed') === '1';
    sound.hidden = verificationMode || embedMode;
    let mounted = null;
    const state = { ready: false, metadata: STAMINA_PRO_GALLERY, gpu: null, error: null,
      audioForcedOff: verificationMode, audioEnabled: false };
    window.__staminaProGallery = state;
    try {
      mounted = await mountStaminaProGallery(host);
      state.gpu = mounted.gpu;
      state.ready = true;
      const toggleSound = async () => {
        if (verificationMode) return;
        try {
          state.audioEnabled = await mounted.toggleSound();
          sound.textContent = state.audioEnabled ? '♪ ON' : '♪ OFF';
          sound.setAttribute('aria-label', state.audioEnabled ? 'SFXをミュートする' : 'SFXを有効にする');
          sound.title = state.audioEnabled ? 'クリックして音をミュート' : 'クリックして音を有効にする';
        } catch (cause) {
          state.error = String(cause?.stack ?? cause);
          error.textContent = `SFXを有効にできません: ${cause?.message ?? cause}`;
          error.hidden = false;
        }
      };
      sound.addEventListener('click', toggleSound);
      if (embedMode && !verificationMode) stage.addEventListener('pointerdown', () => {
        if (!state.audioEnabled) void toggleSound();
      });
    } catch (cause) {
      state.error = String(cause?.stack ?? cause);
      error.textContent = `WebGPU プレビューを起動できません: ${cause?.message ?? cause}`;
      error.hidden = false;
    }
    window.addEventListener('pagehide', () => { void mounted?.dispose(); }, { once: true });
  </script>
</body>
</html>
