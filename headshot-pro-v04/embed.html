<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=980, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Headshot Contact E · GPT Pro v4 embed</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 980px; height: 620px; margin: 0; overflow: hidden; background: #10151d; }
    body { color: #eef2f8; font: 12px/1.3 system-ui, sans-serif; }
    #status { height: 28px; padding: 6px 12px; color: #b4c0d0; background: #1a2230; }
    #status[data-state="ready"] { color: #bff0c6; }
    #status[data-state="error"] { color: #ffd4d8; background: #351f26; }
    iframe { display: block; width: 980px; height: 592px; border: 0; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite" data-state="starting">WebGPU初期化中 · v4 10 variant / H64・H32 / 暗・明</div>
  <iframe id="source" title="Headshot Contact E v4 · 4 WebGPU projections"></iframe>
  <script type="module">
    const frame = document.getElementById('source');
    const status = document.getElementById('status');
    const sourceUrl = new URL('./index.html', location.href);
    sourceUrl.searchParams.set('embed', '1');
    if (new URLSearchParams(location.search).has('verify')) sourceUrl.searchParams.set('verify', '1');
    frame.src = sourceUrl.href;
    window.__headshotEmbed = {
      frame,
      get preview() { return frame.contentWindow?.__headshotPreview ?? null; },
    };
    let poll = 0;
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) {
        status.dataset.state = 'error';
        status.textContent = '埋込元を読み取れません。same-origin配信を確認してください。';
        return;
      }
      // The OS setting is respected by the original page, so explicitly opt
      // this gallery-only adapter into full motion without editing Pro code.
      const reducedMotion = doc.getElementById('reduced');
      if (reducedMotion) {
        reducedMotion.checked = false;
        reducedMotion.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
      }
      frame.contentWindow.__headshotPreview?.system.setReducedMotion(false);
      const link = doc.createElement('link');
      link.rel = 'stylesheet';
      link.href = new URL('./preview/embed.css', location.href).href;
      link.dataset.headshotEmbed = 'v4';
      doc.head.append(link);
      clearInterval(poll);
      poll = window.setInterval(() => {
        const preview = frame.contentWindow?.__headshotPreview;
        const embeddedStatus = doc.getElementById('capability');
        if (preview?.error) {
          status.dataset.state = 'error';
          status.textContent = `WebGPUエラー: ${String(preview.error).split('\n')[0]}`;
        } else if (preview?.ready) {
          status.dataset.state = 'ready';
          status.textContent = `WebGPU ready · submitted ${preview.snapshot.submittedFrames} · active ${preview.snapshot.active}/10`;
        } else if (embeddedStatus?.classList.contains('error')) {
          status.dataset.state = 'error';
          status.textContent = embeddedStatus.textContent;
        }
      }, 250);
    });
    window.addEventListener('pagehide', () => clearInterval(poll), { once: true });
  </script>
</body>
</html>
