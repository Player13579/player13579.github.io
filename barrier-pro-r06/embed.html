<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barrier Pro r0.6 — gallery replay</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#d8eef6;font:13px/1.4 system-ui,sans-serif}
  main{width:980px;height:620px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:8px}
  section{min-width:0;min-height:0;display:grid;grid-template-rows:24px 1fr;border:1px solid rgba(127,220,255,.2);border-radius:10px;background:#05101a;overflow:hidden}
  section.light{background:#e9eef0;color:#27313a}h2{margin:0;padding:4px 10px;font-size:12px;font-weight:500}
  .surface{display:grid;place-items:center}canvas{display:block;width:360px;height:240px}
  #error{position:absolute;left:12px;top:12px;max-width:900px;color:#ffb9b9;background:#2c1720;padding:10px;white-space:pre-wrap}
  #error:empty{display:none}
</style></head><body>
<main>
  <section><h2>H64 / dark</h2><div class="surface"><canvas id="dark64" aria-label="H64 dark Barrier"></canvas></div></section>
  <section class="light"><h2>H64 / light</h2><div class="surface"><canvas id="light64" aria-label="H64 light Barrier"></canvas></div></section>
  <section><h2>H100 / dark</h2><div class="surface"><canvas id="dark100" aria-label="H100 dark Barrier"></canvas></div></section>
  <section class="light"><h2>H100 / light</h2><div class="surface"><canvas id="light100" aria-label="H100 light Barrier"></canvas></div></section>
</main><div id="error" role="alert"></div><script type="module" src="./embed.mjs"></script></body></html>
