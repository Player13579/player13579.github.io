<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Pro Stamina r0.5 — WebGPU preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #10141c; }
    #stage { width: min(980px, 100vw); height: min(620px, 100vh); display: flex; overflow: hidden; }
    #host { display: flex; width: 100%; height: 100%; }
    #error { position: absolute; inset: 12px; z-index: 1; padding: 10px 12px; color: #fff; background: #701f2bdd; font: 14px/1.45 system-ui, sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="stage" aria-label="ChatGPT Pro Stamina r0.5 dark and light WebGPU preview">
    <div id="host"></div>
    <div id="error" role="alert" hidden></div>
  </main>
  <script type="module">
    import { mountStaminaProR05, STAMINA_PRO_R05 } from './adapter.js';
    const host = document.getElementById('host');
    const error = document.getElementById('error');
    const verificationMode = new URLSearchParams(location.search).has('verify');
    let mounted = null;
    const state = { ready: false, metadata: STAMINA_PRO_R05, verify: verificationMode, audioForcedOff: verificationMode, audioEnabled: false, technical: null, error: null };
    window.__staminaProR05 = state;
    try {
      mounted = await mountStaminaProR05(host);
      state.ready = true;
      Object.defineProperty(state, 'technical', { get: () => mounted?.technical ?? null });
    } catch (cause) {
      state.error = String(cause?.stack ?? cause);
      error.textContent = `WebGPU preview could not start: ${cause?.message ?? cause}`;
      error.hidden = false;
    }
    window.addEventListener('pagehide', () => { void mounted?.dispose(); }, { once: true });
  </script>
</body>
</html>
